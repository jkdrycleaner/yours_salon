/* Weekly Report & Accordion Styling */
.weekly-report-container{margin-top:16px;}
.weekly-nav-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:12px;padding:12px 16px;background:#fff;border:1px solid #e1e7ee;border-radius:12px;}
.weekly-nav-info h2{margin:0;font-size:16px;font-weight:700;color:#1d2939;}
.weekly-nav-info p{margin:3px 0 0;font-size:11px;color:#758397;}
.weekly-view-toggle{display:flex;background:#f1f4f8;padding:3px;border-radius:8px;gap:4px;}
.weekly-view-toggle button{border:none;background:transparent;padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700;color:#526176;cursor:pointer;transition:all .15s ease;}

.weekly-table .week-detail-table th{padding:7px 10px;color:#627187;font-size:10px;text-transform:uppercase;background:#f0f4f8;border-bottom:1px solid #e1e7ee;text-align:right;}
.weekly-table .week-detail-table th:first-child,.weekly-table .week-detail-table td:first-child{text-align:left;}
.weekly-table .week-detail-table td{padding:7px 10px;border-bottom:1px solid #edf0f4;text-align:right;}
.weekly-table .week-detail-table .date-cell{color:#b38318;font-weight:700;font-family:monospace,Arial;}
.weekly-table .week-detail-table .detail-total td{font-weight:700;color:#1d2939;border-top:2px solid #c99a23;background:#fdfaf0;}
.weekly-table .latest-date-row td{background:#fafbfc;color:#475467;font-size:11px;}
.weekly-table .latest-date-label{font-weight:600;color:#344054;}
.weekly-table .grand-total td{font-weight:700;border-top:2px solid #c99a23;color:#b38318;font-size:13px;background:#fefdf7;}

const money = value => 'INR ' + Number(value || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const inr = value => '₹' + Math.round(Number(value || 0)).toLocaleString('en-IN');
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

function formatShortDate(rawDate) {
  if (!rawDate) return '';
  const dStr = typeof rawDate === 'string' ? rawDate.slice(0, 10) : new Date(rawDate).toISOString().slice(0, 10);
  const parts = dStr.split('-');
  return parts.length === 3 ? `${parts[2]}/${parts[1]}` : dStr;
}

function getEntryDay(e) {
  const dStr = typeof e.date === 'string' ? e.date.slice(0, 10) : new Date(e.date).toISOString().slice(0, 10);
  const parts = dStr.split('-').map(Number);
  return parts[2] || 0;
}

function getEntryDateStr(e) {
  return typeof e.date === 'string' ? e.date.slice(0, 10) : new Date(e.date).toISOString().slice(0, 10);
}

let currentWeeklyViewMode = 'summary';

function setWeeklyViewMode(mode) {
  currentWeeklyViewMode = mode;
  const weeklyWrap = document.getElementById('weeklySummaryWrap');
  const standardWrap = document.getElementById('standardTableWrap');
  const mobileReport = document.getElementById('mobileReport');
  const btnSummary = document.getElementById('btnWeeklySummary');
  const btnAll = document.getElementById('btnWeeklyAll');

  if (mode === 'summary') {
    if (weeklyWrap) weeklyWrap.style.display = 'block';
    if (standardWrap) {
      standardWrap.style.display = 'none';
      standardWrap.classList.remove('weekly-show-transactions');
    }
    if (mobileReport) mobileReport.style.display = 'none';
    if (btnSummary) btnSummary.classList.add('active');
    if (btnAll) btnAll.classList.remove('active');
  } else {
    if (weeklyWrap) weeklyWrap.style.display = 'none';
    if (standardWrap) {
      standardWrap.style.display = 'block';
      standardWrap.classList.add('weekly-show-transactions');
    }
    if (mobileReport) mobileReport.style.display = 'block';
    if (btnSummary) btnSummary.classList.remove('active');
    if (btnAll) btnAll.classList.add('active');
  }
}

function renderWeeklySummary(data) {
  const thead = document.getElementById('weeklyThead');
  const tbody = document.getElementById('weeklyTbody');
  if (!thead || !tbody) return;

  const collections = (data.rows || []).filter(r => r.type === 'Collection');
  
  const anchorDateStr = dateInput.value || new Date().toISOString().slice(0, 10);
  const [anchorY, anchorM, anchorD] = anchorDateStr.split('-').map(Number);
  const year = anchorY;
  const month = anchorM - 1;
  const selectedDay = anchorD;
  const lastDay = new Date(year, month + 1, 0).getDate();

  // Subtitle with selected month
  const monthName = new Date(year, month, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
  const subEl = document.getElementById('weeklyNavSubtitle');
  if (subEl) subEl.textContent = `Click a week (e.g. Week 1) to view date-wise breakdown · ${monthName}`;

  // Active staff list
  const activeStaff = (data.staffList || []).map(s => s.employeeName).filter(Boolean);
  const entryStaff = collections.map(e => e.employeeName).filter(Boolean);
  let staff = [...new Set([...activeStaff, ...entryStaff])].sort((a,b) => a.localeCompare(b));

  if (employeeInput.value) {
    const selectedText = employeeInput.options[employeeInput.selectedIndex]?.textContent?.split(' · ')[0]?.trim();
    if (selectedText) staff = staff.filter(name => name.toLowerCase() === selectedText.toLowerCase());
  }

  if (!staff.length) staff = ['Staff'];

  // Weeks definition (Standard 4 weeks)
  const weeks = [
    { label: 'Week 1', start: 1, end: 7 },
    { label: 'Week 2', start: 8, end: 14 },
    { label: 'Week 3', start: 15, end: 21 },
    { label: 'Week 4', start: 22, end: lastDay }
  ];

  const today = new Date();
  const isCurrentMonth = (year === today.getFullYear() && month === today.getMonth());
  const activeWeeks = weeks.filter(w => {
    const hasEntries = collections.some(e => {
      const d = getEntryDay(e);
      return d >= w.start && d <= w.end;
    });
    if (hasEntries) return true;
    if (!isCurrentMonth) return true;
    return selectedDay >= w.start;
  }).reverse();

  // Header row
  let headHTML = '<tr><th>Week</th>';
  staff.forEach(name => {
    headHTML += `<th style="text-align:right">${escapeHtml(name)}</th>`;
  });
  headHTML += '<th style="text-align:right">Cost</th><th style="text-align:right">Total</th></tr>';
  thead.innerHTML = headHTML;

  if (!collections.length) {
    tbody.innerHTML = `<tr><td colspan="${staff.length + 3}" class="empty">No collection data found for this month.</td></tr>`;
    return;
  }

  let bodyHTML = '';

  // Latest 2 Dates with data at top
  const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
  const monthDatesWithData = [...new Set(collections.map(e => getEntryDateStr(e)))]
    .filter(d => d.startsWith(monthPrefix))
    .sort()
    .slice(-2)
    .reverse();

  monthDatesWithData.forEach(dateStr => {
    const dayEntries = collections.filter(e => getEntryDateStr(e) === dateStr);
    let rowHTML = `<td class="latest-date-label">Date (${formatShortDate(dateStr)})</td>`;
    let dayAmountTotal = 0;
    let dayCostTotal = 0;

    staff.forEach(name => {
      const rows = dayEntries.filter(e => e.employeeName === name);
      const amt = rows.reduce((s, e) => s + (Number(e.amount) || 0), 0);
      const cost = rows.reduce((s, e) => s + (Number(e.costCutting) || 0), 0);
      dayAmountTotal += amt;
      dayCostTotal += cost;
      rowHTML += `<td>${amt > 0 ? inr(amt) : ''}</td>`;
    });

    const dayCombined = dayAmountTotal + dayCostTotal;
    rowHTML += `<td>${dayCostTotal > 0 ? inr(dayCostTotal) : ''}</td>`;
    rowHTML += `<td style="font-weight:700;color:#c99a23;">${dayCombined > 0 ? inr(dayCombined) : ''}</td>`;
    bodyHTML += `<tr class="latest-date-row">${rowHTML}</tr>`;
  });

  // Week Rows
  activeWeeks.forEach(week => {
    const weekEntries = collections.filter(e => {
      const day = getEntryDay(e);
      return day >= week.start && day <= week.end;
    });

    let weekAmount = 0;
    let weekCost = 0;

    let rowHTML = `<td class="week-expand-cell"
      data-week-start="${week.start}"
      data-week-end="${week.end}"
      data-week-label="${week.label}">
      <span class="week-arrow">▶</span>
      <div class="week-label-inner">
        <div>${week.label}</div>
        <div class="week-sub">${week.start}–${week.end}</div>
      </div>
    </td>`;

    staff.forEach(name => {
      const rows = weekEntries.filter(e => e.employeeName === name);
      const amt = rows.reduce((s, e) => s + (Number(e.amount) || 0), 0);
      const cost = rows.reduce((s, e) => s + (Number(e.costCutting) || 0), 0);
      weekAmount += amt;
      weekCost += cost;
      rowHTML += `<td>${amt > 0 ? inr(amt) : ''}</td>`;
    });

    const weekTotal = weekAmount + weekCost;
    rowHTML += `<td>${weekCost > 0 ? inr(weekCost) : ''}</td>`;
    rowHTML += `<td style="font-weight:700;color:#c99a23;">${weekTotal > 0 ? inr(weekTotal) : ''}</td>`;

    bodyHTML += `<tr>${rowHTML}</tr>`;

    // Accordion detail row for date-wise breakdown inside this week
    bodyHTML += `<tr class="week-detail-row" data-detail-for="${week.label}" style="display:none;">
      <td colspan="${staff.length + 3}">
        <div class="week-detail-wrap" id="detail-${week.label.replace(/\s+/g, '-').toLowerCase()}"></div>
      </td>
    </tr>`;
  });

  // Grant Total row
  let grandAmount = 0;
  let grandCost = 0;
  let grandHTML = '<td style="font-weight:700;color:#c99a23;font-size:13px;">Grant Total</td>';

  staff.forEach(name => {
    const rows = collections.filter(e => e.employeeName === name);
    const amt = rows.reduce((s, e) => s + (Number(e.amount) || 0), 0);
    const cost = rows.reduce((s, e) => s + (Number(e.costCutting) || 0), 0);
    grandAmount += amt;
    grandCost += cost;
    grandHTML += `<td style="font-weight:700;color:#c99a23;font-size:13px;">${amt > 0 ? inr(amt) : ''}</td>`;
  });

  const grandCombined = grandAmount + grandCost;
  grandHTML += `<td style="font-weight:700;color:#c99a23;font-size:13px;">${grandCost > 0 ? inr(grandCost) : ''}</td>`;
  grandHTML += `<td style="font-weight:700;color:#c99a23;font-size:13px;">${grandCombined > 0 ? inr(grandCombined) : ''}</td>`;

  bodyHTML += `<tr class="grand-total">${grandHTML}</tr>`;
  tbody.innerHTML = bodyHTML;

  // Bind click listener for expanding weeks (e.g. Week 1)
  tbody.querySelectorAll('.week-expand-cell').forEach(cell => {
    cell.addEventListener('click', function() {
      const label = this.dataset.weekLabel;
      const detailRow = tbody.querySelector(`.week-detail-row[data-detail-for="${label}"]`);
      const wrap = tbody.querySelector(`.week-detail-row[data-detail-for="${label}"] .week-detail-wrap`);
      const arrow = this.querySelector('.week-arrow');

      if (!detailRow || !wrap) return;

      if (detailRow.style.display === 'none') {
        const startDay = Number(this.dataset.weekStart);
        const endDay = Number(this.dataset.weekEnd);

        const weekEntries = collections.filter(e => {
          const d = getEntryDay(e);
          return d >= startDay && d <= endDay;
        });

        const dates = [...new Set(weekEntries.map(e => getEntryDateStr(e)))].sort();

        let head = '<th>Date</th>';
        staff.forEach(name => head += `<th style="text-align:right">${escapeHtml(name)}</th>`);
        head += '<th style="text-align:right">Cost</th><th style="text-align:right">Total</th>';

        let bRows = '';
        let totalAmount = 0;
        let totalCost = 0;

        dates.forEach(date => {
          const entries = weekEntries.filter(e => getEntryDateStr(e) === date);
          let dateAmount = 0;
          let dateCost = 0;
          let r = `<td class="date-cell">${formatShortDate(date)}</td>`;

          staff.forEach(name => {
            const rows = entries.filter(e => e.employeeName === name);
            const amt = rows.reduce((s, e) => s + (Number(e.amount) || 0), 0);
            const cost = rows.reduce((s, e) => s + (Number(e.costCutting) || 0), 0);
            dateAmount += amt;
            dateCost += cost;
            r += `<td>${amt > 0 ? inr(amt) : ''}</td>`;
          });

          totalAmount += dateAmount;
          totalCost += dateCost;
          const dateCombined = dateAmount + dateCost;
          r += `<td>${dateCost > 0 ? inr(dateCost) : ''}</td>`;
          r += `<td style="font-weight:600;color:#1d2939;">${dateCombined > 0 ? inr(dateCombined) : ''}</td>`;
          bRows += `<tr>${r}</tr>`;
        });

        if (!dates.length) {
          bRows = `<tr><td colspan="${staff.length + 3}" style="text-align:center;color:#758397;padding:12px;">No date-wise entries available for this week.</td></tr>`;
        } else {
          let totalRow = '<td style="font-weight:700;">Week Total</td>';
          staff.forEach(name => {
            const amt = weekEntries.filter(e => e.employeeName === name)
              .reduce((s, e) => s + (Number(e.amount) || 0), 0);
            totalRow += `<td style="font-weight:700;">${amt > 0 ? inr(amt) : ''}</td>`;
          });
          totalRow += `<td style="font-weight:700;">${totalCost > 0 ? inr(totalCost) : ''}</td>`;
          totalRow += `<td style="font-weight:700;color:#c99a23;">${totalAmount + totalCost > 0 ? inr(totalAmount + totalCost) : ''}</td>`;
          bRows += `<tr class="detail-total">${totalRow}</tr>`;
        }

        wrap.innerHTML = `<table class="week-detail-table"><thead><tr>${head}</tr></thead><tbody>${bRows}</tbody></table>`;
        detailRow.style.display = 'table-row';
        if (arrow) arrow.classList.add('open');
      } else {
        detailRow.style.display = 'none';
        if (arrow) arrow.classList.remove('open');
      }
    });
  });
}

const dateInput=document.getElementById('date'),periodInput=document.getElementById('period'),employeeInput=document.getElementById('employee'),rows=document.getElementById('rows'),statusBox=document.getElementById('status');dateInput.value=new Date().toISOString().slice(0,10);function dateText(value){return new Date(value).toLocaleDateString('en-IN')}function params(){const value=new URLSearchParams({period:periodInput.value,date:dateInput.value});if(employeeInput.value)value.set('employeeId',employeeInput.value);return value}function render(data){
  for(const key of ['collection','expense','salary','counter','net'])document.getElementById(key).textContent=money(data.summary[key]);
  document.getElementById('range').textContent=`${data.from} to ${data.to}`;
  
  const isWeekly = periodInput.value === 'weekly';
  const weeklyContainer = document.getElementById('weeklyReportContainer');
  const standardWrap = document.getElementById('standardTableWrap');
  
  if (isWeekly) {
    weeklyContainer.style.display = 'block';
    weeklyContainer.classList.remove('hide-weekly');
    setWeeklyViewMode(currentWeeklyViewMode || 'summary');
    renderWeeklySummary(data);
  } else {
    weeklyContainer.style.display = 'none';
    weeklyContainer.classList.add('hide-weekly');
    if (standardWrap) {
      standardWrap.style.display = 'block';
      standardWrap.classList.remove('weekly-show-transactions');
    }
  }

  rows.replaceChildren();
  if(!data.rows.length){
    const tr=document.createElement('tr');
    tr.innerHTML='<td colspan="7" class="empty">No data found for this period.</td>';
    rows.append(tr);
    return;
  }
  for(const item of data.rows){
    const tr=document.createElement('tr');
    for(const value of [dateText(item.date),item.type,item.employeeName,item.detail||'—',money(item.amount),item.paymentMode||'—',item.createdBy||'—']){
      const td=document.createElement('td');
      td.textContent=value;
      tr.append(td);
    }
    rows.append(tr);
  }
}async function load(){statusBox.className='status';try{render(await salonAuth.request('/api/reports?'+params().toString()))}catch(error){statusBox.textContent=error.message;statusBox.className='status show'}}async function download(format){try{const response=await fetch('/api/reports/export?'+new URLSearchParams({...Object.fromEntries(params()),format}),{headers:salonAuth.headers()});if(!response.ok){const result=await response.json();throw new Error(result.error||'Could not export report.')}const blob=await response.blob();const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`yours-salon-report.${format}`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(error){statusBox.textContent=error.message;statusBox.className='status show'}}document.getElementById('load').addEventListener('click',load);document.getElementById('excel').addEventListener('click',()=>download('xlsx'));document.getElementById('pdf').addEventListener('click',()=>download('pdf'));(async()=>{try{const session=await window.salonReady;if(!session)return;const canExport=session.employee?.role==='Admin'||session.actionAccess?.reports?.export===true;document.getElementById('excel').hidden=!canExport;document.getElementById('pdf').hidden=!canExport;const staff=await salonAuth.request('/api/staff');for(const item of staff)employeeInput.add(new Option(`${item.employeeName} · ${item.employeeId}`,item._id));await load()}catch(error){statusBox.textContent=error.message;statusBox.className='status show'}})();
</script><script>
(() => {
  const period = document.getElementById('period');
  const title = document.getElementById('reportTitle');
  const periods = ['daily', 'weekly', 'monthly'];
  const requested = new URLSearchParams(location.search).get('period');
  if (periods.includes(requested)) period.value = requested;
  function update() {
    const label = period.value.charAt(0).toUpperCase() + period.value.slice(1);
    title.textContent = `${label} Report`;
    document.title = `${label} Report — YOURS SALON`;
    if (window.salonNav?.refresh) window.salonNav.refresh();
  }
  period.addEventListener('change', () => {
    const url = new URL(location.href);
    url.searchParams.set('period', period.value);
    history.replaceState(null, '', url);
    update();
    document.getElementById('load').click();
  });
  update();
})();
</script>
<script>
(() => {
  const mobileReport = document.getElementById('mobileReport');
  const filterButton = document.getElementById('mobileReportFilterButton');
  const filterCount = document.getElementById('mobileReportFilterCount');
  const filterChips = document.getElementById('mobileReportFilterChips');
  const filters = document.getElementById('reportFilters');
  const overlay = document.getElementById('mobileReportFilterOverlay');
  const closeButton = document.getElementById('mobileReportFilterClose');

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
  }

  function updateFilterBar() {
    const chips = [
      periodInput.value.charAt(0).toUpperCase() + periodInput.value.slice(1),
      dateInput.value,
      employeeInput.value ? employeeInput.options[employeeInput.selectedIndex]?.textContent : 'All employees'
    ].filter(Boolean);
    filterCount.textContent = String(chips.length);
    filterChips.replaceChildren();
    for (const text of chips) {
      const chip = document.createElement('span');
      chip.className = 'm-chip';
      chip.textContent = text;
      filterChips.append(chip);
    }
  }

  function closeFilters() {
    filters.classList.remove('mobile-open');
    overlay.classList.remove('open');
    document.documentElement.classList.remove('m-filter-locked');
  }

  function openFilters() {
    filters.classList.add('mobile-open');
    overlay.classList.add('open');
    document.documentElement.classList.add('m-filter-locked');
  }

  function renderMobileReport(data) {
    if (periodInput.value === 'weekly' && currentWeeklyViewMode === 'summary') {
      mobileReport.style.display = 'none';
      return;
    }
    mobileReport.style.display = 'block';
    mobileReport.replaceChildren();
    if (!data.rows.length) {
      const empty = document.createElement('div');
      empty.className = 'm-empty';
      empty.textContent = 'No data found for this period.';
      mobileReport.append(empty);
      return;
    }
    let lastDate = '';
    for (const item of data.rows) {
      const day = dateText(item.date);
      if (day !== lastDate) {
        const label = document.createElement('div');
        label.className = 'm-record-group';
        label.textContent = day;
        mobileReport.append(label);
        lastDate = day;
      }
      const card = document.createElement('article');
      card.className = 'm-record-card';
      const summary = document.createElement('div');
      summary.className = 'm-record-summary';
      const main = document.createElement('div');
      const title = document.createElement('div');
      title.className = 'm-record-title';
      const chip = document.createElement('span');
      chip.className = 'm-entry-chip';
      chip.textContent = item.type || 'Report';
      const name = document.createElement('strong');
      name.textContent = item.employeeName || 'Employee';
      title.append(chip, name);
      const sub = document.createElement('div');
      sub.className = 'm-record-sub';
      sub.textContent = `${item.detail || '—'}${item.paymentMode ? ` · ${item.paymentMode}` : ''}`;
      main.append(title, sub);
      const side = document.createElement('div');
      side.style.textAlign = 'right';
      const amount = document.createElement('div');
      amount.className = 'm-record-amount' + (String(item.type).toLowerCase().includes('expense') ? ' expense' : String(item.type).toLowerCase().includes('salary') ? ' salary' : '');
      amount.textContent = money(item.amount);
      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'm-record-toggle';
      toggle.setAttribute('aria-label', 'Show report details');
      toggle.innerHTML = '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';
      side.append(amount, toggle);
      summary.append(main, side);
      const details = document.createElement('div');
      details.className = 'm-record-details';
      const created = document.createElement('div');
      created.className = 'm-detail-row';
      const term = document.createElement('span');
      term.textContent = 'Created by';
      const value = document.createElement('strong');
      value.textContent = item.createdBy || '—';
      created.append(term, value);
      details.append(created);
      toggle.addEventListener('click', () => {
        card.classList.toggle('open');
        toggle.setAttribute('aria-label', card.classList.contains('open') ? 'Hide report details' : 'Show report details');
      });
      card.append(summary, details);
      mobileReport.append(card);
    }
  }

  const baseRender = render;
  render = function (data) {
    baseRender(data);
    renderMobileReport(data);
    updateFilterBar();
  };

  filterButton.addEventListener('click', openFilters);
  closeButton.addEventListener('click', closeFilters);
  overlay.addEventListener('click', closeFilters);
  document.addEventListener('keydown', event => { if (event.key === 'Escape') closeFilters(); });
  document.getElementById('load').addEventListener('click', closeFilters);
  periodInput.addEventListener('change', updateFilterBar);
  dateInput.addEventListener('change', updateFilterBar);
  employeeInput.addEventListener('change', updateFilterBar);
  updateFilterBar();

  document.getElementById('btnWeeklySummary')?.addEventListener('click', () => setWeeklyViewMode('summary'));
  document.getElementById('btnWeeklyAll')?.addEventListener('click', () => setWeeklyViewMode('all'));
})();
</script></body></html>
