<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Attendance — YOURS SALON</title>
  <link rel="stylesheet" href="/admin-nav.css">
  <link rel="stylesheet" href="/mobile.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#1d2939;font-family:Arial,sans-serif}.wrap{width:min(760px,100%);margin:auto;padding:28px 20px 40px}.soon-panel{padding:28px 20px;border:1px solid #e1e7ee;border-radius:16px;background:#fff;text-align:center;box-shadow:0 8px 24px #1b2a3b08}.soon-icon{display:grid;place-items:center;width:70px;height:70px;margin:0 auto 15px;border-radius:22px;background:#e9f8ef;color:#2b7a50}.soon-icon svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.7}.soon-panel h1{margin:0;font-size:25px}.soon-panel p{max-width:360px;margin:9px auto 0;color:#758397;font-size:13px;line-height:1.55}.soon-panel a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;margin-top:18px;padding:9px 16px;border-radius:10px;background:#c99a23;color:#fff;font:700 12px Arial;text-decoration:none}.today{margin-top:14px;color:#9a7414;font-size:12px;font-weight:700}
  </style>
</head>
<body>
  <main class="wrap m-page">
    <div class="m-page-head"><div><h1>Attendance</h1><p>Your daily attendance record.</p></div></div>
    <section class="soon-panel">
      <div class="soon-icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="m9 15 2 2 4-4"/></svg></div>
      <h1>Attendance is coming soon</h1>
      <p>Attendance tracking will be available here. For now, your collection, expense and salary records are available on the dashboard.</p>
      <div class="today" id="today"></div>
      <a href="/employee-dashboard">Back to dashboard</a>
    </section>
  </main>
  <script src="/auth-guard.js"></script>
  <script src="/admin-nav.js"></script>
  <script src="/mobile.js"></script>
  <script>
    document.getElementById('today').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  </script>
</body>
</html>
