<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Activity Report — YOURS SALON</title><link rel="stylesheet" href="/admin-nav.css"><link rel="stylesheet" href="/table-view.css"><link rel="stylesheet" href="/date-range.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#1d2939;font-family:Arial,sans-serif}.wrap{width:min(1450px,100%);margin:auto;padding:28px 20px 40px}.heading h1{margin:0;font-size:26px}.heading p{margin:6px 0 0;color:#758397;font-size:13px}.filters{display:flex;align-items:end;flex-wrap:wrap;gap:10px;margin-top:18px;padding:13px;background:#fff;border:1px solid #e1e7ee;border-radius:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;color:#526176;font-weight:700}.field input,.field select{height:38px;min-width:145px;padding:8px 10px;border:1px solid #d9e0e7;border-radius:8px;background:#fff;font:13px Arial}.filters button{height:38px;padding:8px 14px;border:0;border-radius:8px;background:#c99a23;color:#fff;font:700 12px Arial;cursor:pointer}.filters button.secondary{background:#eff2f5;color:#344054}.table-wrap{margin-top:15px;overflow:auto;border:1px solid #e1e7ee;border-radius:12px;background:#fff}table{width:100%;min-width:1250px;border-collapse:collapse;font-size:11px}th,td{padding:10px 11px;text-align:left;vertical-align:top;border-bottom:1px solid #edf0f4;white-space:nowrap}th{background:#f8fafc;color:#627187;font-size:10px;text-transform:uppercase}td.value{max-width:300px;white-space:pre-wrap;word-break:break-word}.empty{text-align:center;color:#7b8797;padding:25px}.status{display:none;margin-top:12px;padding:10px;border-radius:8px;background:#fff0ef;color:#a13932;font-size:13px}.status.show{display:block}@media(max-width:600px){.wrap{padding:20px 12px 30px}.filters{align-items:stretch;flex-direction:column}.field input,.field select,.filters button{width:100%}}
</style></head>
<body><main class="wrap"><section class="heading"><h1>Activity Report</h1><p>Authenticated page opens and changes from the last 30 days. Older logs are automatically removed.</p></section><section class="filters"><div class="field"><label>Date range</label><div id="dateRange"></div></div><div class="field"><label for="action">Action</label><select id="action"><option value="">All actions</option><option>PAGE_OPEN</option><option>LOGIN</option><option>LOGOUT</option><option>CREATE</option><option>UPDATE</option><option>DELETE</option><option>DEACTIVATE</option><option>IMPORT</option><option>EXPORT</option><option>PASSWORD_CHANGE</option><option>PASSWORD_RESET</option><option>BULK_DELETE</option></select></div><div class="field"><label for="pageName">Page</label><input id="pageName" placeholder="Collection Entry"></div><div class="field"><label for="actor">Employee/User</label><input id="actor" placeholder="Search name or ID"></div><button id="load" type="button">Apply Filter</button></section><div id="status" class="status" role="status"></div><div class="table-wrap"><table id="activityTable" data-table-view="server" data-page="1" data-page-size="25" data-total="0"><thead><tr><th>Date / Time</th><th>Employee</th><th>Role</th><th>Action</th><th>Page</th><th>Route</th><th>Module</th><th>Record</th><th>Old Value</th><th>New Value</th></tr></thead><tbody id="rows"><tr><td colspan="10" class="empty">Loading activity logs...</td></tr></tbody></table></div></main>
<script src="/auth-guard.js"></script><script src="/admin-nav.js"></script><script src="/table-view.js"></script><script src="/date-range.js"></script><script>
const table=document.getElementById('activityTable'),rows=document.getElementById('rows'),statusBox=document.getElementById('status');let page=1;const dateControl=SalonDateRange.mount(document.getElementById('dateRange'),{defaultPreset:'last30',onChange:()=>{page=1;load()}});
function text(value){if(value===null||value===undefined||value==='')return'—';if(typeof value==='object')return JSON.stringify(value,null,2);return String(value)}function dateText(value){const date=new Date(value);return Number.isNaN(date.getTime())?'—':date.toLocaleString('en-IN')}
function params(){const range=dateControl.getRange();const query=new URLSearchParams({page:String(page),limit:'25',from:range.from,to:range.to});for(const key of ['action','pageName','actor'])if(document.getElementById(key).value)query.set(key,document.getElementById(key).value);return query}
function render(data){rows.replaceChildren();if(!data.logs.length){rows.innerHTML='<tr><td colspan="10" class="empty">No activity found.</td></tr>'}for(const item of data.logs){const tr=document.createElement('tr');const values=[dateText(item.createdAt),item.actorName,item.actorRole,item.action,item.page,item.route,item.module,item.recordType?`${item.recordType} ${item.recordId||''}`.trim():'—',text(item.oldValue),text(item.newValue)];values.forEach((value,index)=>{const td=document.createElement('td');td.textContent=value;if(index>7)td.className='value';tr.append(td)});rows.append(tr)}table.dataset.page=String(data.page);table.dataset.pageSize=String(data.limit);table.dataset.total=String(data.total)}
async function load(){try{render(await salonAuth.request('/api/activity-logs?'+params().toString()))}catch(error){statusBox.textContent=error.message;statusBox.className='status show'}}
document.getElementById('load').addEventListener('click',()=>{page=1;load()});table.addEventListener('table-view-page-change',event=>{page=event.detail.page;load()});load();
</script></body></html>
