<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/app-boot.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>YOURS SALON — Expense Name</title>
  <link rel="stylesheet" href="/admin-nav.css?v=20261105_m4">
  <link rel="stylesheet" href="/table-view.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#F4F5F7;color:#242424;font-family:Arial,sans-serif;padding:0}
    .container{width:100%;max-width:1050px;margin:20px auto 40px;background:#FFF;border:1px solid #E5E7EB;border-radius:16px;padding:24px;box-shadow:0 12px 32px rgba(28,35,45,.08)}
    .header-area{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid #ECEDEF;padding-bottom:16px;margin-bottom:20px}
    h1{font-size:22px;margin:0;font-weight:700;color:#1A1C1E}
    .sub{color:#64748B;font-size:13px;line-height:1.5;margin:6px 0 0}
    .panel{padding:18px;margin-bottom:18px;background:#FAFAFB;border:1px solid #E2E8F0;border-radius:12px}
    .form-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .form-header h2{font-size:15px;margin:0;font-weight:700;color:#334155}
    .form-grid{display:grid;grid-template-columns:80px minmax(180px,1.8fr) minmax(160px,1.4fr) 110px 110px 110px auto auto;align-items:end;gap:10px}
    .field{display:flex;flex-direction:column;gap:5px}
    .field label{font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:0.03em}
    .field input,.field select{width:100%;height:38px;padding:7px 10px;border:1px solid #CBD5E1;border-radius:8px;background:#FFF;color:#1E293B;font-size:13px}
    .field input:focus,.field select:focus{outline:0;border-color:#C49A32;box-shadow:0 0 0 3px rgba(196,154,50,.15)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:8px 14px;border:0;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s ease}
    .btn-primary{background:#C49A32;color:#FFF}
    .btn-primary:hover{background:#B38927}
    .btn-secondary{background:#F1F5F9;color:#475569}
    .btn-secondary:hover{background:#E2E8F0}
    .btn:disabled{opacity:0.55;cursor:not-allowed}
    .table-wrap{overflow:auto;border:1px solid #E2E8F0;border-radius:10px;background:#FFF}
    table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
    th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #F1F5F9}
    th{background:#F8FAFC;color:#64748B;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
    tbody tr:hover{background:#F8FAFC}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
    .badge-cat{background:#EFF6FF;color:#1E40AF;border:1px solid #DBEAFE}
    .badge-unit{background:#F8FAFC;color:#475569;border:1px solid #E2E8F0;font-weight:700}
    .badge-active{background:#F0FDF4;color:#15803D;border:1px solid #BBF7D0}
    .badge-inactive{background:#F1F5F9;color:#64748B;border:1px solid #CBD5E1}
    .row-actions{display:flex;gap:6px}
    .row-actions button{min-height:28px;padding:4px 8px;font-size:11px;border-radius:6px}
    #statusBox{display:none;margin-top:14px;padding:12px 16px;border-radius:8px;font-size:13px;font-weight:600}
    #statusBox.success{display:block;background:#ECFDF5;border:1px solid #A7F3D0;color:#047857}
    #statusBox.error{display:block;background:#FEF2F2;border:1px solid #FECACA;color:#DC2626}
    .empty-state{padding:30px;text-align:center;color:#64748B;font-size:13px}
    @media(max-width:950px){
      .form-grid{grid-template-columns:1fr 1fr}
      .form-grid button{grid-column:1/-1}
    }
    @media(max-width:600px){
      .container{margin:0;border:0;border-radius:0;padding:16px}
      .form-grid{grid-template-columns:1fr}
    }
  </style>
  <link rel="stylesheet" href="/mobile.css?v=20261105_m4">
</head>
<body>
  <main class="container">
    <header class="header-area">
      <div>
        <h1>Expense Name</h1>
        <p class="sub">Manage expense items/products, map them to an <strong>Expense Category</strong>, configure measurement units, and set default rates.</p>
      </div>
      <div>
        <button id="addToggleBtn" class="btn btn-primary" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          <span>Add Expense Name</span>
        </button>
      </div>
    </header>

    <section id="formPanel" class="panel" hidden>
      <div class="form-header">
        <h2 id="formTitle">Add Expense Name</h2>
      </div>
      <form id="expenseNameForm" class="form-grid">
        <div class="field">
          <label for="sr">SR *</label>
          <input id="sr" name="sr" type="number" min="1" step="1" required>
        </div>
        <div class="field">
          <label for="name">Expense Name / Item *</label>
          <input id="name" name="name" maxlength="100" placeholder="e.g. Shaving Cream" required>
        </div>
        <div class="field">
          <label for="category">Category *</label>
          <select id="category" name="category" required>
            <option value="">Loading categories...</option>
          </select>
        </div>
        <div class="field">
          <label for="measurementUnit">Unit</label>
          <select id="measurementUnit" name="measurementUnit">
            <option value="PCS">PCS</option>
            <option value="KG">KG</option>
            <option value="LTR">LTR</option>
            <option value="PKT">PKT</option>
            <option value="BOX">BOX</option>
            <option value="GM">GM</option>
            <option value="ML">ML</option>
            <option value="PAIR">PAIR</option>
            <option value="MTR">MTR</option>
          </select>
        </div>
        <div class="field">
          <label for="defaultRate">Default Rate (₹)</label>
          <input id="defaultRate" name="defaultRate" type="number" min="0" step="1" placeholder="0">
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
        <button id="saveBtn" class="btn btn-primary" type="submit">Save</button>
        <button id="cancelBtn" class="btn btn-secondary" type="button">Cancel</button>
      </form>
    </section>

    <div id="statusBox" role="status" aria-live="polite"></div>

    <section class="panel" style="background:#FFF;padding:14px">
      <div class="form-header">
        <h2>Expense Name List</h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:60px">SR</th>
              <th>Expense Name / Item</th>
              <th>Category</th>
              <th>Unit</th>
              <th>Default Rate</th>
              <th>Status</th>
              <th style="width:100px">Actions</th>
            </tr>
          </thead>
          <tbody id="rowsEl">
            <tr><td colspan="7" class="empty-state">Loading expense names...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/auth-guard.js"></script>
  <script src="/admin-nav.js?v=20261105_m4" defer></script>
  <script>
    const formPanel = document.getElementById('formPanel');
    const form = document.getElementById('expenseNameForm');
    const formTitle = document.getElementById('formTitle');
    const srInput = document.getElementById('sr');
    const nameInput = document.getElementById('name');
    const categorySelect = document.getElementById('category');
    const unitSelect = document.getElementById('measurementUnit');
    const defaultRateInput = document.getElementById('defaultRate');
    const statusSelect = document.getElementById('status');
    const saveBtn = document.getElementById('saveBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const addToggleBtn = document.getElementById('addToggleBtn');
    const rowsEl = document.getElementById('rowsEl');
    const statusBox = document.getElementById('statusBox');

    let expenseTypes = [];
    let categoriesList = [];
    let editingId = '';
    let canAdd = false;
    let canEdit = false;

    function authHeaders(json = true) {
      const headers = {};
      if (json) headers['Content-Type'] = 'application/json';
      const token = localStorage.getItem('salon_google_credential');
      if (token) headers.Authorization = 'Bearer ' + token;
      return headers;
    }

    function showStatus(msg, type = 'success') {
      statusBox.textContent = msg;
      statusBox.className = type;
      statusBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      setTimeout(() => {
        if (statusBox.textContent === msg) {
          statusBox.style.display = 'none';
        }
      }, 5000);
    }

    function nextSr() {
      return expenseTypes.reduce((max, c) => Math.max(max, Number(c.sr || 0)), 0) + 1;
    }

    async function loadCategories() {
      try {
        const res = await fetch('/api/expense-categories', { headers: authHeaders(false) });
        if (res.ok) {
          categoriesList = await res.json();
          categorySelect.innerHTML = categoriesList
            .filter(c => c.status === 'Active')
            .map(c => `<option value="${c.name}">${c.name}</option>`)
            .join('');
          if (!categorySelect.value && categoriesList.length) {
            categorySelect.value = categoriesList[0].name;
          }
        }
      } catch (err) {
        console.error('Error loading categories:', err);
      }
    }

    function openAddForm() {
      editingId = '';
      form.reset();
      srInput.value = nextSr();
      if (categoriesList.length) categorySelect.value = categoriesList[0].name;
      unitSelect.value = 'PCS';
      defaultRateInput.value = '';
      statusSelect.value = 'Active';
      formTitle.textContent = 'Add Expense Name';
      saveBtn.textContent = 'Save';
      formPanel.hidden = false;
      nameInput.focus();
    }

    function openEditForm(item) {
      editingId = item._id;
      srInput.value = item.sr || 1;
      nameInput.value = item.name || '';
      categorySelect.value = item.category || (categoriesList[0]?.name || 'Supplies & Products');
      unitSelect.value = item.measurementUnit || 'PCS';
      defaultRateInput.value = item.defaultRate || '';
      statusSelect.value = item.status || 'Active';
      formTitle.textContent = 'Edit Expense Name';
      saveBtn.textContent = 'Update';
      formPanel.hidden = false;
      nameInput.focus();
      formPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function closeForm() {
      formPanel.hidden = true;
      form.reset();
      editingId = '';
    }

    function render() {
      rowsEl.replaceChildren();
      if (!expenseTypes.length) {
        rowsEl.innerHTML = '<tr><td colspan="7" class="empty-state">No expense names found. Click Add Expense Name to create one.</td></tr>';
        return;
      }

      for (const item of expenseTypes) {
        const tr = document.createElement('tr');

        // SR
        const tdSr = document.createElement('td');
        tdSr.innerHTML = `<strong>${item.sr}</strong>`;
        tr.append(tdSr);

        // Name
        const tdName = document.createElement('td');
        tdName.innerHTML = `<span style="font-weight:600;color:#1E293B">${item.name}</span>`;
        tr.append(tdName);

        // Category
        const tdCat = document.createElement('td');
        tdCat.innerHTML = `<span class="badge badge-cat">${item.category || 'Supplies & Products'}</span>`;
        tr.append(tdCat);

        // Unit
        const tdUnit = document.createElement('td');
        tdUnit.innerHTML = `<span class="badge badge-unit">${item.measurementUnit || 'PCS'}</span>`;
        tr.append(tdUnit);

        // Default Rate
        const tdRate = document.createElement('td');
        tdRate.textContent = item.defaultRate ? '₹' + item.defaultRate : '—';
        tr.append(tdRate);

        // Status
        const tdStatus = document.createElement('td');
        const isActive = item.status === 'Active';
        tdStatus.innerHTML = `<span class="badge ${isActive ? 'badge-active' : 'badge-inactive'}">${item.status}</span>`;
        tr.append(tdStatus);

        // Actions
        const tdActions = document.createElement('td');
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'row-actions';

        if (canEdit) {
          const editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'btn btn-secondary';
          editBtn.textContent = 'Edit';
          editBtn.onclick = () => openEditForm(item);
          actionsDiv.append(editBtn);
        }

        tdActions.append(actionsDiv);
        tr.append(tdActions);

        rowsEl.append(tr);
      }
    }

    async function loadExpenseTypes() {
      try {
        const res = await fetch('/api/expense-types', { headers: authHeaders(false) });
        if (!res.ok) throw new Error('Failed to load expense names');
        expenseTypes = await res.json();
        render();
      } catch (err) {
        console.error(err);
        showStatus(err.message || 'Error loading expense names', 'error');
      }
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const sr = Number(srInput.value);
      const name = nameInput.value.trim();
      const category = categorySelect.value;
      const measurementUnit = unitSelect.value;
      const defaultRate = Number(defaultRateInput.value) || 0;
      const status = statusSelect.value;

      if (!sr || !name) {
        showStatus('Please enter valid SR and Name', 'error');
        return;
      }

      saveBtn.disabled = true;
      try {
        const url = editingId ? `/api/expense-types/${editingId}` : '/api/expense-types';
        const method = editingId ? 'PUT' : 'POST';
        const res = await fetch(url, {
          method,
          headers: authHeaders(),
          body: JSON.stringify({ sr, name, category, measurementUnit, defaultRate, status })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Save failed');

        showStatus(editingId ? 'Expense Name updated.' : 'Expense Name added.', 'success');
        closeForm();
        await loadExpenseTypes();
      } catch (err) {
        showStatus(err.message, 'error');
      } finally {
        saveBtn.disabled = false;
      }
    });

    addToggleBtn.onclick = () => {
      if (formPanel.hidden) openAddForm();
      else closeForm();
    };

    cancelBtn.onclick = closeForm;

    (async () => {
      const session = await window.salonReady;
      const role = session?.employee?.role;
      const cfg = session?.actionAccess?.configuration;
      canAdd = role === 'Admin' || cfg?.add === true;
      canEdit = role === 'Admin' || cfg?.edit === true;

      if (!canAdd) addToggleBtn.style.display = 'none';

      await Promise.all([loadCategories(), loadExpenseTypes()]);
    })().catch(err => {
      showStatus(err.message, 'error');
    });
  </script>
  <script src="/mobile.js?v=20261105_m4" defer></script>
</body>
</html>
