<!doctype html>
<html lang="en">
<head>
  <script src="/app-boot.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Entry — YOURS SALON</title>
  <link rel="stylesheet" href="/admin-nav.css">
  <link rel="stylesheet" href="/mobile.css">
  <link rel="stylesheet" href="/my-work.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#1d2939;font-family:Arial,sans-serif}.wrap{width:min(920px,100%);margin:auto;padding:28px 20px 40px}.panel{padding:20px;background:#fff;border:1px solid #e1e7ee;border-radius:15px;box-shadow:0 8px 24px #1b2a3b08}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:16px}.heading h1{margin:0;font-size:25px}.heading p{margin:6px 0 0;color:#758397;font-size:13px}.links{display:flex;flex-wrap:wrap;gap:8px}.links a{min-height:38px;padding:9px 12px;border-radius:9px;background:#eff2f5;color:#344054;text-decoration:none;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.wide{grid-column:1/-1}.field label{color:#526176;font-size:11px;font-weight:700}.field input,.field select,.field textarea{width:100%;min-height:42px;padding:9px 11px;border:1px solid #d9e0e7;border-radius:9px;background:#fff;color:#243244;font:14px Arial}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:#d1a228;box-shadow:0 0 0 3px #f8f0d7}.actions{display:flex;align-items:center;gap:10px;margin-top:18px}.actions button{min-height:42px;padding:10px 16px;border:0;border-radius:9px;background:#c99a23;color:#fff;font:700 13px Arial;cursor:pointer}.actions button:disabled{opacity:.6;cursor:wait}.status{display:none;margin-top:14px;padding:11px;border-radius:9px;font-size:13px;line-height:1.45}.status.show{display:block;background:#eaf8f1;color:#22694d}.status.error{display:block;background:#fff0ef;color:#9a352f}.empty{padding:22px;text-align:center;color:#718096;background:#fff;border:1px dashed #d4dce5;border-radius:12px}@media(max-width:600px){.wrap{padding:18px 12px 30px}.heading{flex-direction:column}.grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.panel{padding:15px}.actions button{width:100%}}
  </style>
</head>
<body>
  <main class="wrap m-page">
    <section class="panel">
      <div class="heading"><div><h1 id="title">Entry</h1><p id="description">Save a new salon record.</p></div><div class="links"><a id="tableLink" href="#">View Records</a></div></div>
      <div id="empty" class="empty" hidden></div>
      <form id="entryForm" hidden><div id="fields" class="grid"></div><div class="actions"><button id="save" type="submit">Save Entry</button></div></form>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>
  </main>
  <section id="mobileAddWork" class="aw-page" hidden>
    <div class="aw-greeting" hidden style="display:none !important">
      <div>
        <p id="awGreeting"></p>
        <h1 id="awEmployeeName"></h1>
      </div>
      <div class="aw-date"><span id="awDay"></span><strong id="awDate"></strong></div>
    </div>
    <div class="aw-segmented-tabs">
      <div class="aw-tab active">
        <span class="aw-tab-icon">+</span>
        <span>Add Work</span>
      </div>
      <a class="aw-tab" href="/collection-table">
        <span>All Work</span>
        <span class="aw-chevron">›</span>
      </a>
    </div>
    <div class="aw-status-strip">
      <div class="aw-today-box">
        <span class="aw-status-lbl">Today:</span>
        <strong id="awTodayTotal">₹0</strong>
        <small id="awTodayCount" hidden></small>
      </div>
      <div class="aw-count-box">
        Customer Count: <strong id="awCustomerCount">#1</strong>
      </div>
    </div>
    <form id="awForm" class="aw-form" novalidate>
      <div class="aw-main-card">
        <div class="aw-date-row">
          <div class="aw-field">
            <label for="awDateSelect">Date</label>
            <div class="aw-date-control">
              <select id="awDateSelect" name="entryDate" required></select>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M7.5 3v4M16.5 3v4M3.5 9.5h17"/></svg>
            </div>
          </div>
          <div class="aw-field">
            <label for="awEntryNo">Entry No.</label>
            <div class="aw-entry-control"><span>#</span><input id="awEntryNo" name="entryNo" type="number" min="1" step="1" inputmode="numeric" required></div>
          </div>
        </div>
        <div class="aw-hint-row"><span>Tap A Service To Add &middot; Tap &ndash; To Remove</span><button id="awClearAll" class="no-btn-theme" type="button">Clear All</button></div>
        <div class="aw-service-grid">
          <div id="awMainServices" class="aw-services"></div>
          <button id="awOtherButton" class="aw-other-card no-btn-theme" type="button">
            <span class="aw-other-copy">
              <strong>
                <svg class="aw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                <span>Other</span>
              </strong>
              <small>All Services</small>
            </span>
            <span class="aw-other-icon">&rsaquo;</span>
          </button>
        </div>
        <div class="aw-lower-row">
          <div class="aw-field"><label for="awCostCutting">Cost Cutting</label><div class="aw-money-control"><span>₹</span><input id="awCostCutting" name="costCutting" type="number" min="0" step="0.01" inputmode="decimal" value="0"></div></div>
          <div class="aw-field"><label>Payment</label><div class="aw-pay"><label><input type="radio" name="paymentMode" value="Cash" checked><span>Cash</span></label><label><input type="radio" name="paymentMode" value="Online"><span>Online</span></label></div></div>
        </div>
        <div class="aw-field aw-remark-field"><label for="awRemark">Remark (Optional)</label><textarea id="awRemark" name="remark" maxlength="1000" placeholder="Add A Note"></textarea></div>
        <div id="awStatus" class="aw-status" role="status" aria-live="polite"></div>
      </div>
    </form>
    <div class="aw-bottom-bar">
      <div class="aw-total-box"><span>TOTAL &middot; <b id="awItemCount">0</b> ITEMS</span><label class="aw-total-edit"><span>₹</span><input id="awTotal" type="number" min="0" step="0.01" inputmode="decimal" value="0" aria-label="Total amount"></label></div>
      <button id="awSave" class="aw-save" data-salon-btn-theme type="submit" form="awForm">Save Work</button>
    </div>
  </section>
  <div id="awSheetOverlay" class="aw-sheet-overlay"></div>
  <section id="awServiceSheet" class="aw-sheet" role="dialog" aria-label="All services">
    <div class="aw-sheet-handle"></div>
    <div class="aw-sheet-head"><h2>All Services</h2><button id="awSheetClose" type="button" hidden>Close</button></div>
    <label class="aw-search-control">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="awServiceSearch" type="search" placeholder="Search Service">
    </label>
    <div id="awAllServices" class="aw-sheet-list"></div>
    <div class="aw-custom" hidden>
      <h3>Add Custom Service</h3>
      <div class="aw-custom-row">
        <input id="awCustomName" maxlength="150" placeholder="Service name">
        <input id="awCustomRate" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Rate">
        <button id="awCustomAdd" type="button">Add</button>
      </div>
      <p id="awCustomStatus" role="status"></p>
    </div>
    <button id="awSheetDone" class="aw-sheet-done" type="button">Done</button>
  </section>
  <div id="awSavedOverlay" class="aw-saved-overlay" aria-hidden="true">
    <section class="aw-saved-card" role="dialog" aria-modal="true" aria-labelledby="awSavedTitle">
      <span class="aw-saved-kicker">Saved</span>
      <h2 id="awSavedTitle">Entry details</h2>
      <dl id="awSavedDetails" class="aw-saved-details"></dl>
      <div class="aw-saved-progress"><span></span></div>
      <p class="aw-saved-refresh">Refreshing in 3 seconds...</p>
    </section>
  </div>
  <script src="/auth-guard.js"></script>
  <script src="/admin-nav.js"></script>
  <script src="/mobile.js"></script>
  <script>
    const routePath=location.pathname.replace(/\/+$/,'')||'/';
    const moduleKey=routePath.split('/').pop().replace('-entry','');
    const queryParams=new URLSearchParams(location.search);
    const editId=queryParams.get('edit')||'';
    const preselectedEmployeeId=queryParams.get('employeeId')||'';
    const definitions={
      collection:{title:'Collection Entry',description:'Record a salon collection for an employee.',permission:'Customer Entry',table:'/collection-table'},
      expense:{title:'Expense Entry',description:'Record an assigned employee expense.',permission:'Daily Expense',table:'/expense-table'},
      salary:{title:'Salary Entry',description:'Record salary paid for a selected month.',permission:'Salary',table:'/salary-table'},
      counter:{title:'Counter Cash Entry',description:'Record cash received or held at the salon counter.',permission:'Cash At Counter',table:'/counter-table'}
    };
    const definition=definitions[moduleKey]||definitions.collection;
    const fields=document.getElementById('fields'),form=document.getElementById('entryForm'),statusBox=document.getElementById('status'),saveButton=document.getElementById('save');
    let session=null,config=null,staff=[],expenseTypes=[],editingRecord=null;
    document.getElementById('title').textContent=editId?`Edit ${definition.title}`:definition.title;
    document.getElementById('description').textContent=definition.description;
    document.getElementById('tableLink').href=definition.table;
    function field(label,id,type='text',required=true,wide=false){const wrap=document.createElement('div');wrap.className='field'+(wide?' wide':'');const title=document.createElement('label');title.textContent=label;title.htmlFor=id;const input=document.createElement(type==='select'?'select':type==='textarea'?'textarea':'input');input.id=id;input.name=id;if(type!=='select'&&type!=='textarea')input.type=type;input.required=required;wrap.append(title,input);fields.append(wrap);return input}
    function options(select,items,placeholder){select.replaceChildren(new Option(placeholder,''));for(const item of items)select.add(new Option(item.label,item.value))}
    function staffForEmployee(employeeId){return staff.find(item=>item._id===employeeId)||(session.employee.role==='Admin'?null:staff[0]||null)}
    function updateEntryDateOptions(employeeId,preferredDate){
      const select=form.elements.namedItem('entryDate');if(!select||!config)return;
      const today=config.todayDate;
      const dates=new Set([today]);
      const employee=staffForEmployee(employeeId);
      if(config.allowPreviousEntry)for(const date of employee?.allowedEntryDates||[])dates.add(date);
      if(preferredDate)dates.add(preferredDate);
      const wanted=preferredDate||select.value||today;
      select.replaceChildren();
      for(const date of [...dates].sort((left,right)=>right.localeCompare(left))){
        select.add(new Option(date===today?`Today · ${date}`:date,date));
      }
      select.value=dates.has(wanted)?wanted:today;
    }
    function addEntryDateField(){
      const wrap=document.createElement('div');wrap.className='field';
      const label=document.createElement('label');label.textContent='Entry date';label.htmlFor='entryDate';
      const select=document.createElement('select');select.id='entryDate';select.name='entryDate';select.required=true;
      wrap.append(label,select);fields.append(wrap);return select;
    }
    function showStatus(message,error=false){statusBox.textContent=message;statusBox.className='status show'+(error?' error':'')}
    const isMobileViewport=window.matchMedia('(max-width:700px)').matches;
    const mobileAddWork=document.getElementById('mobileAddWork');
    const awDateSelect=document.getElementById('awDateSelect'),awEntryNo=document.getElementById('awEntryNo');
    awEntryNo.addEventListener('input',()=>{const c=document.getElementById('awCustomerCount');if(c)c.textContent='#'+(awEntryNo.value||'1');});
    const awMainServices=document.getElementById('awMainServices'),awAllServices=document.getElementById('awAllServices');
    const awTotal=document.getElementById('awTotal'),awItemCount=document.getElementById('awItemCount');
    const awTodayTotal=document.getElementById('awTodayTotal'),awTodayCount=document.getElementById('awTodayCount');
    const awStatus=document.getElementById('awStatus'),awSave=document.getElementById('awSave');
    const awSheet=document.getElementById('awServiceSheet'),awSheetOverlay=document.getElementById('awSheetOverlay');
    const awSearch=document.getElementById('awServiceSearch'),awCustomStatus=document.getElementById('awCustomStatus'),awSheetDone=document.getElementById('awSheetDone');
    const awSavedOverlay=document.getElementById('awSavedOverlay'),awSavedDetails=document.getElementById('awSavedDetails');
    let awMeta=null,awServices=[],awQuantities=new Map(),awEditing=null,awEditDate='',awBusy=false,awEventsBound=false,awTotalManual=false,awSavedPending=false;
    function awMoney(value){return '₹'+Number(value||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
    function awDateLabel(value){if(!value)return'';const date=new Date(`${value}T00:00:00`);return Number.isNaN(date.getTime())?String(value):date.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
    function awSetStatus(message,error=false){awStatus.textContent=message;awStatus.className='aw-status'+(message?' show':'')+(message&&error?' error':'')}
    function awSavedRow(label,value){
      const row=document.createElement('div');row.className='aw-saved-row';
      const term=document.createElement('dt');term.textContent=label;
      const detail=document.createElement('dd');detail.textContent=value;
      row.append(term,detail);awSavedDetails.append(row);
    }
    function awShowSavedDetails(record,redirectTo){
      const date=String(record.entryDate||'').slice(0,10);
      const items=Array.isArray(record.items)&&record.items.length
        ? record.items.map(item=>`${item.shortName||item.serviceType}${Number(item.quantity||1)>1?` x${item.quantity}`:''}`).join(', ')
        : record.serviceType||'';
      awSavedDetails.replaceChildren();
      awSavedRow('Entry No.',`#${record.entryNo||awEntryNo.value}`);
      awSavedRow('Date',awDateLabel(date));
      awSavedRow('Employee',record.staff||session?.employee?.employeeName||'');
      if(items)awSavedRow('Services',items);
      awSavedRow('Amount',awMoney(record.amount));
      if(Number(record.costCutting||0)>0)awSavedRow('Cost Cutting',awMoney(record.costCutting));
      awSavedRow('Payment',record.paymentMode||'Cash');
      if(record.remark)awSavedRow('Remark',record.remark);
      awSavedOverlay.classList.add('open');
      awSavedOverlay.setAttribute('aria-hidden','false');
      document.body.classList.add('aw-saved-locked');
      window.setTimeout(()=>{if(redirectTo)location.replace(redirectTo);else location.reload()},3000);
    }
    function awGreetingText(){const hour=new Date().getHours();return hour<12?'Good Morning':hour<17?'Good Afternoon':'Good Evening'}
    function awFindService(serviceType){return awServices.find(item=>String(item.serviceType).toLowerCase()===String(serviceType).toLowerCase())}
    function awSortServices(){awServices.sort((left,right)=>{const leftSr=Number.isFinite(Number(left.sr))?Number(left.sr):Number.MAX_SAFE_INTEGER;const rightSr=Number.isFinite(Number(right.sr))?Number(right.sr):Number.MAX_SAFE_INTEGER;return leftSr-rightSr||String(left.serviceType).localeCompare(String(right.serviceType))})}
    function awAddService(item,overrides={}){
      const existing=awFindService(item.serviceType);
      if(existing){Object.assign(existing,overrides);return existing}
      const service={_id:String(item._id||item.serviceType),sr:Number(item.sr||0),serviceType:item.serviceType,shortName:item.shortName||item.serviceType,rate:Number(item.rate||0),category:item.category||'Other',status:item.status||'Active',...overrides};
      awServices.push(service);awSortServices();return service;
    }
    function awSelectedItems(){
      return awServices.filter(service=>Number(awQuantities.get(service.serviceType)||0)>0).map(service=>{
        const quantity=Number(awQuantities.get(service.serviceType)||0);
        return{serviceType:service.serviceType,shortName:service.shortName||service.serviceType,rate:Number(service.rate||0),quantity,amount:Math.round(Number(service.rate||0)*quantity*100)/100};
      });
    }
    function awGrossValue(){return Math.round(awSelectedItems().reduce((sum,item)=>sum+item.amount,0)*100)/100}
    function awCuttingValue(){const value=Number(document.getElementById('awCostCutting').value||0);return Number.isFinite(value)&&value>0?Math.round(value*100)/100:0}
    function awDefaultTotal(){return Math.round((awGrossValue()+awCuttingValue())*100)/100}
    function awTotalValue(){if(!awTotalManual||String(awTotal.value).trim()==='')return awDefaultTotal();const value=Number(awTotal.value);return Number.isFinite(value)&&value>=0?Math.round(value*100)/100:awDefaultTotal()}
    function awChange(service,delta){
      const key=service.serviceType;
      const next=Math.max(0,Math.min(999,Number(awQuantities.get(key)||0)+delta));
      if(next>0)awQuantities.set(key,next);else awQuantities.delete(key);
      awTotalManual=false;
      awRenderServices();
    }
    function awQtyControls(service){
      const wrap=document.createElement('span');wrap.className='aw-qty';
      const minus=document.createElement('button');minus.type='button';minus.setAttribute('aria-label',`Remove one ${service.serviceType}`);minus.textContent='−';
      const qty=document.createElement('strong');qty.textContent=String(awQuantities.get(service.serviceType)||0);
      const plus=document.createElement('button');plus.type='button';plus.setAttribute('aria-label',`Add one ${service.serviceType}`);plus.textContent='+';
      minus.addEventListener('click',event=>{event.stopPropagation();awChange(service,-1)});
      plus.addEventListener('click',event=>{event.stopPropagation();awChange(service,1)});
      wrap.append(minus,qty,plus);return wrap;
    }
        const awIcons={
      haircut:'<svg class="aw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>',
      shaving:'<svg class="aw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m14 14-9 9"/><path d="M5 14l9 9"/><path d="M18 4l2 2-8 8-2-2 8-8z"/><path d="M16 2l6 6"/></svg>',
      beard:'<svg class="aw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 8h16"/><path d="M4 12h16"/><path d="M4 16c2 4 6 5 8 5s6-1 8-5"/></svg>',
      moustache:'<svg class="aw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 14c-2-3-6-3-9 0 3 4 8 2 9 0z"/><path d="M12 14c2-3 6-3 9 0-3 4-8 2-9 0z"/></svg>',
      massage:'<svg class="aw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M12 3v1"/><path d="M8 4l1 1"/><path d="M16 4l-1 1"/></svg>',
      spa:'<svg class="aw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 2a9 9 0 0 1 9 9c0 5-4 9-9 9s-9-4-9-9a9 9 0 0 1 9-9z"/><path d="M12 6c-3 3-3 6 0 9 3-3 3-6 0-9z"/></svg>',
      wash:'<svg class="aw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>',
      facial:'<svg class="aw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>',
      color:'<svg class="aw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m19 11-8-8-8.5 8.5a5 5 0 0 0 7 7L18 10z"/><path d="m5 2 5 5"/><circle cx="17.5" cy="17.5" r="3.5"/></svg>',
      nail:'<svg class="aw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v5"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8a7 7 0 0 0 14 0v-3"/></svg>',
      wax:'<svg class="aw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 3h6v4H9z"/><path d="M10 7v14"/><path d="M14 7v14"/></svg>',
      dryer:'<svg class="aw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="9" r="5"/><path d="M13 9h7l1 3h-8"/><path d="M8 14v7"/></svg>',
      sparkle:'<svg class="aw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m12 3 1.9 5.8L20 10.7l-4.5 4.3 1.1 6.2L12 18.2l-4.6 3 1.1-6.2-4.5-4.3 6.1-1.9z"/></svg>',
      default:'<svg class="aw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>'
    };
    function awGetIcon(name){
      const s=String(name||'').toLowerCase();
      if(s.includes('shav'))return awIcons.shaving;
      if(s.includes('moustache'))return awIcons.moustache;
      if(s.includes('beard'))return awIcons.beard;
      if(s.includes('cut')||s.includes('trim'))return awIcons.haircut;
      if(s.includes('head mass')||s.includes('foot mass')||s.includes('back mass'))return awIcons.massage;
      if(s.includes('body')||s.includes('aromatherapy')||s.includes('scrub')||s.includes('polishing')||s.includes('spa'))return awIcons.spa;
      if(s.includes('nail')||s.includes('manicure')||s.includes('pedicure')||s.includes('hand & foot'))return awIcons.nail;
      if(s.includes('wax'))return awIcons.wax;
      if(s.includes('wash')||s.includes('shampoo'))return awIcons.wash;
      if(s.includes('blow dry'))return awIcons.dryer;
      if(s.includes('facial')||s.includes('cleanup')||s.includes('mask')||s.includes('bleach')||s.includes('tan')||s.includes('acne')||s.includes('aging'))return awIcons.facial;
      if(s.includes('color')||s.includes('dye')||s.includes('touch-up')||s.includes('highlight'))return awIcons.color;
      if(s.includes('keratin')||s.includes('rebond')||s.includes('straight')||s.includes('smooth')||s.includes('treat')||s.includes('dandruff')||s.includes('scalp')||s.includes('oil'))return awIcons.sparkle;
      return awIcons.default;
    }
    function awServiceCard(service){
      const qty=Number(awQuantities.get(service.serviceType)||0);
      const card=document.createElement('div');card.className='aw-service'+(qty?' selected':'');card.tabIndex=0;card.setAttribute('role','button');
      card.setAttribute('aria-label',`${service.shortName||service.serviceType}, ${awMoney(service.rate)}`);
      if(qty){const badge=document.createElement('span');badge.className='aw-qty-badge';badge.textContent=String(qty);card.append(badge)}
      const copy=document.createElement('span');copy.className='aw-service-copy';
      const label=service.shortName||service.serviceType;const name=document.createElement('strong');name.className='aw-service-name';name.innerHTML=awGetIcon(label);const labelText=document.createElement('span');labelText.textContent=label;name.append(labelText);
      const rate=document.createElement('small');rate.className='aw-service-rate';rate.textContent=awMoney(service.rate);
      copy.append(name,rate);
      const action=document.createElement('span');action.className='aw-service-action';
      if(qty){
        const minus=document.createElement('button');minus.type='button';minus.className='aw-minus no-btn-theme';minus.setAttribute('aria-label',`Remove one ${service.serviceType}`);minus.textContent='−';
        minus.addEventListener('click',event=>{event.stopPropagation();awChange(service,-1)});
        action.append(minus);
      }else{
        const plus=document.createElement('span');plus.className='aw-plus no-btn-theme';plus.textContent='+';plus.setAttribute('aria-hidden','true');
        action.append(plus);
      }
      card.append(copy,action);
      card.addEventListener('click',event=>{if(event.target.closest('button'))return;awChange(service,1)});
      card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();awChange(service,1)}});
      return card;
    }
    function awSheetRow(service){
      const qty=Number(awQuantities.get(service.serviceType)||0);
      const row=document.createElement('div');row.className='aw-sheet-row'+(qty?' selected':'');
      const left=document.createElement('div');left.className='aw-sheet-row-left';
      const iconWrap=document.createElement('div');iconWrap.className='aw-sheet-row-icon';
      iconWrap.innerHTML=awGetIcon(service.serviceType);
      const info=document.createElement('div');info.className='aw-sheet-row-name';
      const name=document.createElement('strong');name.textContent=service.shortName||service.serviceType;
      const sub=document.createElement('small');
      sub.textContent=`${awMoney(service.rate)}${service.serviceCategory ? ' · ' + service.serviceCategory : ''}`;
      info.append(name,sub);
      left.append(iconWrap,info);
      const controls=document.createElement('span');controls.className='aw-sheet-controls';
      if(qty){
        const minus=document.createElement('button');minus.type='button';minus.className='aw-minus';minus.setAttribute('aria-label',`Remove one ${service.serviceType}`);minus.textContent='−';
        const count=document.createElement('strong');count.textContent=String(qty);
        const plus=document.createElement('button');plus.type='button';plus.className='aw-plus';plus.setAttribute('aria-label',`Add one ${service.serviceType}`);plus.textContent='+';
        minus.addEventListener('click',event=>{event.stopPropagation();awChange(service,-1)});
        plus.addEventListener('click',event=>{event.stopPropagation();awChange(service,1)});
        controls.append(minus,count,plus);
      }else{
        const add=document.createElement('button');add.type='button';add.className='aw-plus no-btn-theme';add.textContent='+';add.setAttribute('aria-label',`Add ${service.serviceType}`);
        add.addEventListener('click',event=>{event.stopPropagation();awChange(service,1)});
        controls.append(add);
      }
      row.append(left,controls);
      row.addEventListener('click',event=>{if(event.target.closest('button'))return;awChange(service,1)});
      return row;
    }
    function awRenderSheet(){
      const search=String(awSearch.value||'').trim().toLowerCase();
      awAllServices.replaceChildren();
      const list=awServices.filter(service=>{
        if(!search)return true;
        const text=`${service.serviceType} ${service.shortName||''} ${service.serviceCategory||''}`.toLowerCase();
        return text.includes(search);
      });
      if(!list.length){
        const empty=document.createElement('div');empty.className='m-empty';
        empty.textContent=search?'No matching service.':'No active services in the Rate List.';
        awAllServices.append(empty);
      }else if(search){
        for(const service of list)awAllServices.append(awSheetRow(service));
      }else{
        const groups={};
        for(const service of list){
          const cat=service.serviceCategory||'Other Services';
          if(!groups[cat])groups[cat]=[];
          groups[cat].push(service);
        }
        for(const [catName,catServices] of Object.entries(groups)){
          const heading=document.createElement('div');
          heading.className='aw-sheet-cat-heading';
          heading.textContent=catName;
          awAllServices.append(heading);
          for(const service of catServices){
            awAllServices.append(awSheetRow(service));
          }
        }
      }
      const selected=awSelectedItems();
      const count=selected.reduce((sum,item)=>sum+item.quantity,0);
      awSheetDone.textContent=`Done${count?` · ${count} ${count===1?'Item':'Items'} · ${awMoney(awTotalValue())}`:''}`;
    }
    function awRenderServices(){
      awSortServices();
      const main=awServices.filter(service=>(service.category||'Main')!=='Other');
      awMainServices.replaceChildren();
      if(!main.length){const empty=document.createElement('div');empty.className='m-empty';empty.textContent='No Main services in the Rate List.';awMainServices.append(empty)}
      else for(const service of main)awMainServices.append(awServiceCard(service));
      const otherQty=awServices.filter(service=>(service.category||'Main')==='Other').reduce((sum,service)=>sum+Number(awQuantities.get(service.serviceType)||0),0);
      const otherBtn=document.getElementById('awOtherButton');
      if(otherBtn){
        otherBtn.classList.toggle('selected',otherQty>0);
        let badge=otherBtn.querySelector('.aw-qty-badge');
        if(otherQty>0){
          if(!badge){
            badge=document.createElement('span');
            badge.className='aw-qty-badge';
            otherBtn.append(badge);
          }
          badge.textContent=String(otherQty);
        }else if(badge){
          badge.remove();
        }
      }
      const selected=awSelectedItems();
      awItemCount.textContent=String(selected.reduce((sum,item)=>sum+item.quantity,0));
      if(!awTotalManual)awTotal.value=String(awTotalValue());
      awSave.textContent=awEditing?'Update Work':'Save Work';
      awRenderSheet();
    }
    function awRenderDateOptions(dates,selected){
      const set=new Set([...(dates||[]),selected,awEditDate].filter(Boolean));
      awDateSelect.replaceChildren();
      for(const date of [...set].sort((left,right)=>right.localeCompare(left))){
        awDateSelect.add(new Option(awDateLabel(date),date));
      }
      awDateSelect.value=set.has(selected)?selected:(awMeta?.todayDate||'');
    }
    async function awLoadMeta(date,options={}){
      const query=date?`?date=${encodeURIComponent(date)}`:'';
      const meta=await salonAuth.request('/api/collection-entry-meta'+query);
      const previous=awServices;
      awMeta=meta;
      awServices=meta.services.map(item=>({_id:String(item._id),sr:Number(item.sr||0),serviceType:item.serviceType,shortName:item.shortName||item.serviceType,rate:Number(item.rate||0),category:item.category||'Main',serviceCategory:item.serviceCategory||'',status:item.status||'Active'}));
      for(const [key,qty] of awQuantities){
        if(qty>0&&!awFindService(key)){
          const old=previous.find(service=>service.serviceType===key);
          if(old)awServices.push({...old});
        }
      }
      awSortServices();
      awRenderDateOptions(meta.allowedDates,date||meta.todayDate);
      awTodayTotal.textContent=awMoney(meta.todayTotal);
      awTodayCount.textContent=`${Number(meta.todayCount||0)} ${Number(meta.todayCount||0)===1?'entry':'entries'}`;
      if(awEditing&&awDateSelect.value===awEditDate&&!options.forceNext)awEntryNo.value=String(awEditing.entryNo);
      else awEntryNo.value=String(meta.nextEntryNo);
      const custCount=document.getElementById('awCustomerCount');if(custCount)custCount.textContent='#'+(awEntryNo.value||'1');
      awRenderServices();
    }
    function awApplyEditingRecord(record){
      const source=Array.isArray(record.items)&&record.items.length
        ? record.items
        : [{serviceType:record.serviceType,shortName:record.serviceType,rate:record.amount,quantity:1,amount:record.amount}];
      for(const item of source){
        const existing=awFindService(item.serviceType);
        const service=existing||awAddService({...item,category:'Other',status:'Inactive',sr:999999});
        if(Number(item.rate)>0)service.rate=Number(item.rate);
        if(item.shortName)service.shortName=item.shortName;
        awQuantities.set(service.serviceType,Number(item.quantity||1));
      }
      document.getElementById('awCostCutting').value=String(Number(record.costCutting||0));
      const payment=document.querySelector(`input[name="paymentMode"][value="${record.paymentMode==='Online'?'Online':'Cash'}"]`);
      if(payment)payment.checked=true;
      document.getElementById('awRemark').value=record.remark||'';
    }
    function awOpenSheet(){awSheetOverlay.classList.add('open');awSheet.classList.add('open');document.body.classList.add('aw-sheet-locked')}
    function awCloseSheet(){awSheetOverlay.classList.remove('open');awSheet.classList.remove('open');document.body.classList.remove('aw-sheet-locked')}
    async function awAddCustomService(){
      const name=String(document.getElementById('awCustomName').value||'').trim();
      const rate=Number(document.getElementById('awCustomRate').value);
      awCustomStatus.className='';
      if(!name){awCustomStatus.textContent='Enter the service name.';return}
      if(!Number.isFinite(rate)||rate<=0){awCustomStatus.textContent='Enter a valid rate.';return}
      const button=document.getElementById('awCustomAdd');button.disabled=true;awCustomStatus.textContent='Adding...';
      try{
        const item=await salonAuth.request('/api/collection-custom-services',{method:'POST',body:JSON.stringify({serviceType:name,rate})});
        const service=awAddService(item,{category:item.category||'Other',status:'Active'});
        awQuantities.set(service.serviceType,1);
        document.getElementById('awCustomName').value='';document.getElementById('awCustomRate').value='';
        awCustomStatus.className='ok';awCustomStatus.textContent='Custom service added.';
        awRenderServices();
      }catch(error){
        if(error.payload?.service){
          const service=awAddService(error.payload.service,{category:error.payload.service.category||'Other'});
          awQuantities.set(service.serviceType,1);
          awCustomStatus.className='';awCustomStatus.textContent='That service already existed, so it was selected.';
          awRenderServices();
        }else{
          awCustomStatus.textContent=error.message||'Could not add the custom service.';
        }
      }finally{button.disabled=false}
    }
    function awBindEvents(){
      if(awEventsBound)return;awEventsBound=true;
      document.getElementById('awForm').addEventListener('submit',async event=>{
        event.preventDefault();
        if(awBusy||awSavedPending)return;
        const items=awSelectedItems();
        if(!items.length){awSetStatus('Add at least one service.',true);return}
        const date=awDateSelect.value;
        const entryNo=Number(awEntryNo.value);
        if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){awSetStatus('Select a valid entry date.',true);return}
        if(!Number.isSafeInteger(entryNo)||entryNo<1){awSetStatus('Enter a valid Entry No.',true);return}
        const costCutting=Number(document.getElementById('awCostCutting').value||0);
        if(!Number.isFinite(costCutting)||costCutting<0){awSetStatus('Enter a valid Cost Cutting amount.',true);return}
        const paymentMode=document.querySelector('input[name="paymentMode"]:checked')?.value||'Cash';
        const total=awTotalValue();
        if(!Number.isFinite(total)||total<0){awSetStatus('Enter a valid Total amount.',true);return}
        awBusy=true;awSave.disabled=true;awSave.textContent=awEditing?'Updating...':'Saving...';awSetStatus('');
        try{
          const payload={
            entryDate:date,
            entryNo,
            staffId:session.employee.employeeId,
            staff:session.employee.employeeName,
            serviceType:items.map(item=>`${item.shortName}${item.quantity>1?` x${item.quantity}`:''}`).join(', ').slice(0,1000),
            amount:total,
            total,
            items,
            costCutting,
            paymentMode,
            remark:String(document.getElementById('awRemark').value||'').trim()
          };
          const result=await salonAuth.request(awEditing?`/api/collections/${encodeURIComponent(awEditing._id)}`:'/api/save-collection',{
            method:awEditing?'PUT':'POST',
            body:JSON.stringify(payload)
          });
          const saved=result.record||{...payload,entryNo:result.entryNo||entryNo};
          awSavedPending=true;
          awSave.disabled=true;
          awSave.textContent='Saved';
          awSetStatus('');
          awShowSavedDetails(saved,awEditing?'/collection-table':'');
        }catch(error){awSetStatus(error.message||'Could not save the work entry.',true)}
        finally{if(!awSavedPending){awBusy=false;awSave.disabled=false;awSave.textContent=awEditing?'Update Work':'Save Work'}}
      });
      awDateSelect.addEventListener('change',async()=>{
        if(awBusy||!awMeta)return;
        awTotalManual=false;
        try{await awLoadMeta(awDateSelect.value,{forceNext:!awEditing||awDateSelect.value!==awEditDate});awSetStatus('')}
        catch(error){awSetStatus(error.message||'Could not load that date.',true)}
      });
      document.getElementById('awOtherButton').addEventListener('click',awOpenSheet);
      document.getElementById('awCostCutting').addEventListener('input',()=>{awTotalManual=false;awTotal.value=String(awDefaultTotal())});
      awTotal.addEventListener('input',()=>{awTotalManual=true});
      document.getElementById('awClearAll').addEventListener('click',()=>{awQuantities.clear();awTotalManual=false;awRenderServices();awSetStatus('')});
      document.getElementById('awSheetClose').addEventListener('click',awCloseSheet);
      document.getElementById('awSheetDone').addEventListener('click',awCloseSheet);
      awSheetOverlay.addEventListener('click',awCloseSheet);
      awSearch.addEventListener('input',awRenderSheet);
      document.getElementById('awCustomAdd').addEventListener('click',awAddCustomService);
      document.getElementById('awCustomRate').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();awAddCustomService()}});
      document.addEventListener('keydown',event=>{if(event.key==='Escape')awCloseSheet()});
    }
    async function awInit(){
      document.querySelector('main.wrap').hidden=true;
      mobileAddWork.hidden=false;
      document.body.classList.add('aw-mobile-page');
      document.title=`${editId?'Edit':'Add'} Work - YOURS SALON`;
      const employee=session.employee||{};
      const addAccess=session.actionAccess?.collection?.add===true||(!session.actionAccess&&(employee.role==='Admin'||session.permissions.includes('Customer Entry')));
      if(!addAccess)document.querySelector('.aw-custom').hidden=true;
      document.getElementById('awGreeting').textContent=awGreetingText();
      document.getElementById('awEmployeeName').textContent=employee.employeeName||'Employee';
      document.getElementById('awDate').textContent=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
      document.getElementById('awDay').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long'});
      if(editId){
        const result=await salonAuth.request(`/api/module-records?module=collection&id=${encodeURIComponent(editId)}&limit=1`);
        awEditing=result.records?.[0]||null;
        if(!awEditing)throw new Error('The selected work entry could not be found.');
        awEditDate=String(awEditing.entryDate).slice(0,10);
      }
      awBindEvents();
      await awLoadMeta(awEditDate);
      if(awEditing){
        awApplyEditingRecord(awEditing);
        awEntryNo.value=String(awEditing.entryNo);
        awRenderServices();
        awTotalManual=true;
        awTotal.value=String(Math.round((Number(awEditing.amount||0)+Number(awEditing.costCutting||0))*100)/100);
      }
    }
    function buildForm(){
      fields.replaceChildren();document.title=`${editingRecord?'Edit ':''}${definition.title} - YOURS SALON`;document.getElementById('title').textContent=editingRecord?`Edit ${definition.title}`:definition.title;
      let employeeSelect=null;
      if(session.employee.role==='Admin'){
        employeeSelect=field('Employee','employeeId','select',true);
        options(employeeSelect,staff.map(item=>({value:item._id,label:`${item.employeeName} · ${item.employeeId}`})),'Select employee');
        if(preselectedEmployeeId&&staff.some(item=>item._id===preselectedEmployeeId))employeeSelect.value=preselectedEmployeeId;
      }
      addEntryDateField();
      if(moduleKey==='collection'){
        const entryNo=field('Entry number','entryNo','number');entryNo.min='1';entryNo.step='1';
        field('Service type','serviceType');
        const amount=field('Amount (INR)','amount','number');amount.min='0.01';amount.step='0.01';
        const cost=field('Cost cutting (INR)','costCutting','number',false);cost.min='0';cost.step='0.01';
         const payment=field('Payment mode','paymentMode','select');options(payment,[{value:'Cash',label:'Cash'},{value:'Online',label:'Online'}],'Select payment mode');payment.value='Cash';
         field('Remark','remark','textarea',false,true);
      }else{
        if(moduleKey==='expense'){
          const type=field('Expense type','expenseTypeSr','select');
          const list=session.employee.role==='Admin'?expenseTypes:session.expenseTypes;
          options(type,list.map(item=>({value:String(item.sr),label:`${item.sr} · ${item.name}`})),'Select expense type');
        }
        if(moduleKey==='salary'){const month=field('Salary month','salaryMonth','month');month.value=config.todayDate.slice(0,7);}
        const amount=field('Amount (INR)','amount','number');amount.min='0.01';amount.step='0.01';
        if(moduleKey!=='counter'){const payment=field('Payment mode','paymentMode','select');options(payment,[{value:'Cash',label:'Cash'},{value:'Online',label:'Online'}],'Select payment mode');payment.value='Cash';}
        field('Remark','remark','textarea',false,true);
      }
      if(editingRecord){
        const values={...editingRecord,employeeId:editingRecord.employeeId||editingRecord.staffId};
        if(values.entryDate)values.entryDate=String(values.entryDate).slice(0,10);
        for(const [key,value] of Object.entries(values)){const input=form.elements.namedItem(key);if(input&&value!==null&&value!==undefined)input.value=String(value)}
      }
      updateEntryDateOptions(employeeSelect?.value||'',editingRecord?.entryDate?String(editingRecord.entryDate).slice(0,10):'');
      if(employeeSelect)employeeSelect.addEventListener('change',()=>updateEntryDateOptions(employeeSelect.value));
      form.hidden=false;
      saveButton.textContent=editingRecord?'Update Entry':'Save Entry';
      form.dataset.employee=employeeSelect?.id||'';
    }
    form.addEventListener('submit',async event=>{
      event.preventDefault();const wasEditing=Boolean(editingRecord);saveButton.disabled=true;saveButton.textContent=wasEditing?'Updating...':'Saving...';
      try{
        const data=Object.fromEntries(new FormData(form).entries());
        if(moduleKey==='collection'){
          const employee=staff.find(item=>item._id===data.employeeId);
          if(session.employee.role!=='Admin'){data.staffId=session.employee.employeeId;data.staff=session.employee.employeeName}
          else {data.staff=employee?.employeeName||'';data.staffId=data.employeeId}
          const endpoint=wasEditing?`/api/collections/${encodeURIComponent(editingRecord._id)}`:'/api/save-collection';
          await salonAuth.request(endpoint,{method:wasEditing?'PUT':'POST',body:JSON.stringify(data)});
        }else{
          data.recordType=moduleKey;
          const endpoint=wasEditing?`/api/employee-records/${encodeURIComponent(editingRecord._id)}`:'/api/employee-records';
          await salonAuth.request(endpoint,{method:wasEditing?'PUT':'POST',body:JSON.stringify(data)});
        }
        const successMessage=wasEditing?'Entry updated successfully.':'Entry saved successfully.';editingRecord=null;history.replaceState(null,document.title,location.pathname);if(window.salonUi?.showSuccess){await window.salonUi.showSuccess(successMessage);location.reload();return}showStatus(successMessage);form.reset();buildForm();
      }catch(error){showStatus(error.message||'Could not save the entry.',true)}finally{saveButton.disabled=false;saveButton.textContent=editingRecord?'Update Entry':'Save Entry'}
    });
    window.salonPageReady=(async()=>{
      try{
        session=await window.salonReady;
        if(!session)return;
        const requiredAction=editId?'edit':'add';
        const requiredAccess=session.actionAccess?.[moduleKey]?.[requiredAction];
        if(session.employee.role!=='Admin'&&(requiredAccess===false||(requiredAccess===undefined&&!session.permissions.includes(definition.permission)))){
          document.getElementById('empty').hidden=false;document.getElementById('empty').textContent=`You do not have ${definition.permission} access.`;return;
        }
        if(moduleKey==='collection'&&session.employee.role!=='Admin'&&isMobileViewport){
          await awInit();return;
        }
        config=await salonAuth.request('/api/public-config');
        staff=await salonAuth.request('/api/staff');
        if(session.employee.role==='Admin')expenseTypes=await salonAuth.request('/api/expense-types');
        if(editId){
          const result=await salonAuth.request(`/api/module-records?module=${encodeURIComponent(moduleKey)}&id=${encodeURIComponent(editId)}&limit=1`);
          editingRecord=result.records?.[0]||null;
          if(!editingRecord)throw new Error('The selected record could not be found.');
        }
        buildForm();
      }catch(error){
        if(mobileAddWork&&!mobileAddWork.hidden){awSetStatus(error.message||'Could not load the entry form.',true);return}
        document.getElementById('empty').hidden=false;document.getElementById('empty').textContent=error.message||'Could not load the entry form.';
      }
    })();
  </script>
</body>
</html>
