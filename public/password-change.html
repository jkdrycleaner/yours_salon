<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Change Password - YOURS SALON</title>
  <link rel="stylesheet" href="/admin-nav.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f6f9;color:#1d2939;font-family:Arial,sans-serif}
    .wrap{width:min(620px,100%);margin:auto;padding:34px 20px 50px}
    .panel{padding:24px;background:#fff;border:1px solid #e1e7ee;border-radius:15px;box-shadow:0 8px 24px #1b2a3b08}
    .panel h1{margin:0;font-size:24px}
    .panel p{margin:7px 0 20px;color:#758397;font-size:13px;line-height:1.5}
    .field{display:flex;flex-direction:column;gap:6px;margin-top:13px}
    .field label{color:#526176;font-size:11px;font-weight:700}
    .field input{width:100%;height:43px;padding:9px 11px;border:1px solid #d9e0e7;border-radius:9px;font:14px Arial}
    .field input:focus{outline:0;border-color:#d1a228;box-shadow:0 0 0 3px #f8f0d7}
    .actions{display:flex;justify-content:flex-end;margin-top:18px}
    .actions button{min-height:42px;padding:10px 17px;border:0;border-radius:9px;background:#c99a23;color:#fff;font:700 13px Arial;cursor:pointer}
    .actions button:disabled{opacity:.6;cursor:wait}
    .status{display:none;margin-top:13px;padding:11px;border-radius:9px;background:#fff0ef;color:#9a352f;font-size:13px}
    .status.show{display:block}
    @media(max-width:600px){.wrap{padding:20px 12px 35px}.panel{padding:17px}.actions button{width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <h1>Change Password</h1>
      <p id="description">Update your account password. This page is available from the header next to Sign out.</p>
      <form id="passwordForm">
        <div id="adminUserIdField" class="field" hidden>
          <label for="adminUserId">Administrator User ID</label>
          <input id="adminUserId" type="text" autocomplete="username" maxlength="100">
        </div>
        <div class="field"><label for="currentPassword">Current password</label><input id="currentPassword" type="password" autocomplete="current-password" required maxlength="200"></div>
        <div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="200"></div>
        <div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="200"></div>
        <div class="actions"><button id="save" type="submit">Update Password</button></div>
      </form>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="/auth-guard.js"></script>
  <script src="/admin-nav.js"></script>
  <script>
    const form=document.getElementById('passwordForm'),statusBox=document.getElementById('status'),save=document.getElementById('save'),adminUserIdField=document.getElementById('adminUserIdField'),adminUserId=document.getElementById('adminUserId'),newPassword=document.getElementById('newPassword'),confirmPassword=document.getElementById('confirmPassword'),description=document.getElementById('description');
    function showError(message){statusBox.textContent=message;statusBox.className='status show'}
    (async()=>{
      try{
        const session=await window.salonReady;
        if(!session)return;
        const isBootstrapAdmin=session.employee.role==='Admin'&&!session.employee.employeeId;
        if(isBootstrapAdmin){
          adminUserIdField.hidden=false;
          adminUserId.value=session.employee.userId||'';
          adminUserId.required=true;
          newPassword.minLength=12;
          confirmPassword.minLength=12;
          description.textContent='Update the administrator User ID and password. This page is available from the header next to Sign out.';
        }
        form.addEventListener('submit',async event=>{
          event.preventDefault();
          if(newPassword.value!==confirmPassword.value){showError('Passwords do not match.');return}
          save.disabled=true;
          try{
            const payload={currentPassword:document.getElementById('currentPassword').value,newPassword:newPassword.value};
            const endpoint=isBootstrapAdmin?'/api/admin-credentials':'/api/change-password';
            if(isBootstrapAdmin)payload.userId=adminUserId.value.trim().toLowerCase();
            const result=await salonAuth.request(endpoint,{method:'POST',body:JSON.stringify(payload)});
            if(result.token)localStorage.setItem('salon_google_credential',result.token);
            await window.salonUi.showSuccess(result.message||'Password changed successfully.');
            location.replace('/admin-dashboard');
          }catch(error){showError(error.message||'Could not change the password.')}finally{save.disabled=false}
        });
      }catch(error){showError(error.message||'Could not load your account.')}
    })();
  </script>
</body>
</html>
