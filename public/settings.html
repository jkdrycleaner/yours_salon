<!doctype html>
<html lang="en">
<head>
  <script src="/app-boot.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Settings — YOURS SALON</title>
  <link rel="stylesheet" href="/admin-nav.css">
  <link rel="stylesheet" href="/mobile.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#1d2939;font-family:Arial,sans-serif}.wrap{width:min(760px,100%);margin:auto;padding:28px 20px 40px}.settings-panel{padding:20px;border:1px solid #e1e7ee;border-radius:16px;background:#fff;box-shadow:0 8px 24px #1b2a3b08}.settings-panel h1{margin:0;font-size:26px}.settings-panel>p{margin:6px 0 0;color:#758397;font-size:13px}.settings-list{display:grid;gap:9px;margin-top:18px}.settings-link{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:12px 15px;border:1px solid #e4e9ef;border-radius:12px;background:#fff;color:#1d2939;font:700 13px Arial;text-decoration:none;cursor:pointer}.settings-link small{display:block;margin-top:4px;color:#8a96a5;font-size:11px;font-weight:400}.settings-link .chev{color:#98a2b3;font-size:19px}.settings-link.danger{color:#b42318}.settings-note{margin-top:18px;color:#8a96a5;font-size:11px;line-height:1.5}
  </style>
</head>
<body>
  <main class="wrap m-page">
    <div class="top"><div class="tl"><div class="t-badge">⚙️</div><div><div class="t-sub">Employee Portal</div><h2>Settings</h2></div></div></div>
    <section class="settings-panel">
      <h1>Settings</h1>
      <p>Manage your employee account and app access.</p>
      <div class="settings-list">
        <a class="settings-link" href="/profile"><span>My profile<small>Employee details and contact information</small></span><span class="chev">›</span></a>
        <a class="settings-link" href="/password-change"><span>Change password<small>Update your sign-in password</small></span><span class="chev">›</span></a>
        <a class="settings-link" href="/employee-dashboard"><span>Dashboard<small>Go back to your collection summary</small></span><span class="chev">›</span></a>
        <button id="logout" class="settings-link danger" type="button"><span>Logout<small>Sign out of this device</small></span><span class="chev">›</span></button>
      </div>
      <div class="settings-note">YOURS SALON · Employee portal</div>
    </section>
  </main>
  <script src="/auth-guard.js"></script>
  <script src="/admin-nav.js"></script>
  <script src="/mobile.js"></script>
  <script>
    document.getElementById('logout').addEventListener('click', () => window.salonAuth?.logout?.());
    (async () => {
      try {
        const session = await window.salonReady;
        if (session?.pageAccess && session.pageAccess.profile === false) {
          document.querySelector('.settings-link[href="/profile"]')?.remove();
        }
      } catch {}
    })();
  </script>
</body>
</html>
