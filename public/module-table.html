  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#1d2939;font-family:Arial,sans-serif}.wrap{width:min(1250px,100%);margin:auto;padding:28px 20px 40px}.panel{padding:20px;background:#fff;border:1px solid #e1e7ee;border-radius:15px;box-shadow:0 8px 24px #1b2a3b08}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.heading h1{margin:0;font-size:25px}.heading p{margin:6px 0 0;color:#758397;font-size:13px}.links{display:flex;flex-wrap:wrap;gap:8px}.links a,.action{min-height:35px;padding:8px 11px;border:0;border-radius:8px;background:#eff2f5;color:#344054;text-decoration:none;font:700 12px Arial;cursor:pointer}.links a.add{background:#c99a23;color:#fff}.action.delete{background:#fff0ef;color:#9a352f}.action.deactivate{background:#fff9e8;color:#765b14}.filters{display:flex;flex-wrap:wrap;align-items:end;gap:10px;margin-top:18px;padding:13px;background:#fafbfc;border:1px solid #e6ebf0;border-radius:11px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;color:#526176;font-weight:700}.field select{height:38px;min-width:150px;padding:8px 10px;border:1px solid #d9e0e7;border-radius:8px;background:#fff;font:13px Arial}.filters button{height:38px;padding:8px 14px;border:0;border-radius:8px;background:#c99a23;color:#fff;font:700 12px Arial;cursor:pointer}.filters button.secondary{background:#eff2f5;color:#344054}.table-wrap{margin-top:16px;overflow:auto;border:1px solid #e1e7ee;border-radius:11px}table{width:100%;min-width:1080px;border-collapse:collapse;font-size:12px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #edf0f4;white-space:nowrap}th{background:#f8fafc;color:#627187;font-size:10px;text-transform:uppercase}tbody tr:last-child td{border-bottom:0}.empty{text-align:center;color:#7b8797;padding:25px}.status{display:none;margin-top:12px;padding:10px;border-radius:8px;font-size:13px}.status.show{display:block;background:#fff0ef;color:#a13932}.row-actions{display:flex;gap:6px}.row-actions .action{min-height:30px;padding:6px 9px;font-size:11px}.row-inactive td{color:#a13932}.row-inactive td.sticky-action{background:#fff7f6}.badge{display:inline-block;padding:4px 7px;border-radius:99px;background:#e9f6f1;color:#286b53;font-size:10px;font-weight:700}.badge.inactive{background:#fff0ef;color:#a13932}.details-dialog{width:min(520px,92vw);padding:0;border:0;border-radius:14px;box-shadow:0 22px 60px #17233245}.details-dialog::backdrop{background:#17233266}.details-card{padding:20px}.details-card h2{margin:0 0 14px;font-size:18px}.details-list{display:grid;grid-template-columns:150px 1fr;gap:9px;margin:0}.details-list dt{color:#758397;font-size:12px;font-weight:700}.details-list dd{margin:0;color:#243244;font-size:12px;overflow-wrap:anywhere}.details-actions{display:flex;justify-content:flex-end;margin-top:17px}.details-actions button{min-height:36px;padding:8px 14px;border:0;border-radius:8px;background:#eff2f5;color:#344054;font:700 12px Arial;cursor:pointer}@media(max-width:620px){.wrap{padding:20px 12px 30px}.filters{align-items:stretch;flex-direction:column}.field select{width:100%}.filters button{width:100%}.links{width:100%}.links a{flex:1;text-align:center}.details-list{grid-template-columns:1fr}.details-list dt{margin-top:7px}}
  </style>
  <style>
    .bulk-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border:1px solid #e6ebf0;border-radius:9px;background:#f8fafc;font-size:12px;color:#475467}

  <style>
    .sal-page{display:none;width:100%;max-width:760px;margin:0 auto;padding:16px 16px 24px;background:#f4f7fb;color:#1d2939;font-family:Arial,sans-serif}
    body.mobile-employee.salary-mobile .sal-page{display:block}
    body.mobile-employee.salary-mobile .m-page,body.mobile-employee.salary-mobile .m-filter-bar,body.mobile-employee.salary-mobile .m-mobile-records,body.mobile-employee.salary-mobile .m-list-meta,body.mobile-employee.salary-mobile .m-mobile-load-more{display:none!important}
    .sal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 16px}
    .sal-head h1{margin:0;color:#1d2939;font:800 30px/1.1 Arial,sans-serif;letter-spacing:-.03em}
    .sal-month-pill{position:relative;display:flex;align-items:center;gap:7px;min-height:42px;padding:8px 13px;border:1px solid #f0dfb0;border-radius:14px;background:#fff5dc;color:#8a6a12;font:700 14px Arial,sans-serif;cursor:pointer;white-space:nowrap}
    .sal-month-pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
    .sal-month-pill input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
    .sal-summary{padding:18px;border:1px solid #e7ebf0;border-radius:24px;background:#fff;box-shadow:0 10px 24px #1b2a3b0a}
    .sal-line{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #edf0f4}
    .sal-line:first-child{padding-top:0}
    .sal-line:last-of-type{border-bottom:0;padding-bottom:0}
    .sal-icon{display:grid;place-items:center;width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:#f4f6f9;color:#667085;font:800 22px/1 Arial,sans-serif}
    .sal-copy{min-width:0;flex:1}
    .sal-copy strong{display:block;color:#1d2939;font-size:17px;letter-spacing:-.01em}
    .sal-copy small{display:block;overflow:hidden;margin-top:3px;color:#8a96a5;font-size:10.5px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}
    .sal-line>b{font-size:20px;letter-spacing:-.02em;white-space:nowrap}
    .sal-green{color:#0b7a43}.sal-orange{color:#b26a00}.sal-blue{color:#2f6fed}
    .sal-taken{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;color:#667085;font-size:13px}
    .sal-taken b{color:#667085;font-weight:700}
    .sal-progress{display:flex;height:12px;overflow:hidden;margin-top:8px;border-radius:99px;background:#dff4e8}
    .sal-progress span{height:100%}
    .sal-advance-bar{background:#e3a11a}.sal-salary-bar{background:#2f7cf6}.sal-extra-bar{background:#b42318}
    .sal-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;color:#667085;font-size:11px}
    .sal-legend span{display:inline-flex;align-items:center;gap:5px}
    .sal-legend i{width:8px;height:8px;border-radius:50%}
    .sal-legend .advance i{background:#e3a11a}.sal-legend .salary i{background:#2f7cf6}.sal-legend .extra i{background:#b42318}
    .sal-balance{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:16px 18px;border-radius:16px;background:#202b38;color:#fff}
    .sal-balance span{display:block;font:800 13px Arial,sans-serif;letter-spacing:.04em}
    .sal-balance small{display:block;margin-top:3px;color:#cbd3dc;font-size:13px}
    .sal-balance strong{color:#f4c64d;font-size:26px;letter-spacing:-.02em;white-space:nowrap}
    .sal-balance.extra{background:#3b1f1f}
    .sal-balance.extra span,.sal-balance.extra strong{color:#f2a7a7}
    .sal-money-head h2{margin:22px 0 12px;color:#1d2939;font-size:22px;letter-spacing:-.02em}
    .sal-filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
    .sal-filter{min-height:40px;padding:9px 16px;border:1px solid #e5e9ef;border-radius:99px;background:#fff;color:#344054;font:700 14px Arial,sans-serif;white-space:nowrap;cursor:pointer}
    .sal-filter.active{border-color:#f0dfb0;background:#fff5dc;color:#8a6a12}
    .sal-list{display:grid;gap:10px;margin-top:14px}
    .sal-row{display:flex;align-items:center;gap:10px;padding:16px;border:1px solid #e7ebf0;border-radius:16px;background:#fff;box-shadow:0 6px 16px #1b2a3b06}
    .sal-date{min-width:58px;color:#1d2939;font-size:16px;font-weight:800;white-space:nowrap}
    .sal-chip{padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
    .sal-chip.advance{background:#fff5dc;color:#b26a00}.sal-chip.salary{background:#eaf2ff;color:#2f6fed}
    .sal-amount{margin-left:auto;font-size:18px;font-weight:800;white-space:nowrap}
    .sal-amount.advance{color:#b26a00}.sal-amount.salary{color:#2f6fed}
    .sal-empty{padding:24px 12px;border:1px dashed #dce3eb;border-radius:14px;color:#8a96a5;font-size:13px;text-align:center;background:#fff}
    .sal-status{display:none;margin-top:12px;padding:11px;border-radius:10px;background:#fff0ef;color:#a13832;font-size:13px}
    .sal-status.show{display:block}
  </style>
</head>
<body>
  <main class="wrap m-page">
    <section class="panel">
      <div class="heading">
        <div><h1 id="title">Records</h1><p id="description">View saved salon records.</p></div>
        <div class="links"><a id="entryLink" class="add" href="#">Add</a></div>
      </div>
      <div class="m-filter-bar" id="mobileFilterBar">
        <button id="mobileFilterButton" class="m-filter-button" type="button">Filter <span id="mobileFilterCount" class="m-filter-count">0</span></button>
        <span id="mobileFilterChips" style="display:flex;gap:7px"></span>
      </div>
      <div class="filters" id="recordFilters">
        <div class="field"><label>Date range</label><div id="dateRange"></div></div>
        <div id="employeeField" class="field" hidden><label for="employee">Employee</label><select id="employee"><option value="">All employees</option></select></div>
        <div class="field"><label for="statusFilter">Status</label><select id="statusFilter"><option value="Active">Active</option><option value="All">All</option><option value="Inactive">In-Active</option></select></div>
        <button id="filter" type="button">Apply Filter</button>
        <button id="clear" class="secondary" type="button">Clear</button>
        <button id="mobileFilterClose" class="secondary m-filter-close" type="button">Close</button>
      </div>
      <div id="mobileFilterOverlay" class="m-filter-overlay"></div>
      <div id="status" class="status" role="status"></div>
      <div id="bulkBar" class="bulk-bar" hidden>
        <span><strong id="selectedCount">0</strong> row(s) selected</span>
        <button id="bulkDelete" class="action delete" type="button" disabled>Delete Selected Permanently</button>
        <button id="clearSelection" class="action clear" type="button" disabled>Clear Selection</button>
      </div>
      <div class="m-list-meta" id="mobileListMeta"></div>
      <div id="mobileRecords" class="m-mobile-records"></div>
      <button id="mobileLoadMore" class="m-load-more" type="button" hidden>Load 10 more</button>
      <div class="table-wrap">
        <table id="recordsTable" data-table-view="server" data-page="1" data-page-size="10" data-total="0">
          <thead id="head"></thead>
          <tbody id="rows"><tr><td class="empty">Loading records...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <section id="salaryMobile" class="sal-page" hidden>
    <div class="sal-head">
      <h1>My Salary</h1>
      <label class="sal-month-pill">
        <span id="salMonthLabel">October 2026</span>
        <input id="salMonth" type="month" aria-label="Salary month">
      </label>
    </div>
    <div id="salSummary" class="sal-summary"></div>
    <div class="sal-money-head"><h2>Money Taken</h2></div>
    <div id="salFilters" class="sal-filters"></div>
    <div id="salList" class="sal-list"></div>
    <div id="salStatus" class="sal-status" role="status"></div>
  </section>
  <section id="mobileAllWork" class="mw-page" hidden>
    <!-- Segmented Tabs (Add Work vs All Work) -->
    <div class="aw-segmented-tabs">
      <a class="aw-tab no-btn-theme" href="/collection-entry">
        <span class="aw-tab-icon">+</span>
        <span>Add Work</span>
      </a>
      <div class="aw-tab active">
        <span>All Work</span>
        <span class="aw-chevron">›</span>
      </div>

    <!-- Unified Single-Line Filter & Stats Bar -->
    <div class="mw-single-filter-card">
      <div class="mw-filter-group">
        <button class="mw-filter-icon-btn no-btn-theme" id="mwFilterButton" type="button" title="Filter Records" aria-label="Filter Records">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16l-6.5 7.5V19l-3 1.5v-8z"/></svg>
        </button>
        <button class="mw-pill-btn no-btn-theme" id="mwPreset7" type="button">7 Days</button>
        <button class="mw-pill-btn no-btn-theme active" id="mwPresetMonth" type="button">This Month</button>
        <button class="mw-pill-btn no-btn-theme" id="mwPresetCustom" type="button">
          <span>Custom</span>
          <svg class="mw-pill-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>

        </div>
        <div class="mw-custom-field">
          <label for="mwCustomTo">To Date</label>

      </div>
      <button id="mwCustomApply" class="mw-custom-apply-btn no-btn-theme" type="button">Apply Range</button>

    <div id="mwListMeta" class="mw-list-meta" hidden></div>
    <div id="mwRecords"></div>
    <button id="mwLoadMore" class="mw-load-more no-btn-theme" type="button" hidden>Load more</button>
    <div id="mwStatus" class="mw-status" role="status" aria-live="polite"></div>
  </section>

  <!-- Filter Bottom Sheet Popup -->
  <div id="mwFilterOverlay" class="mw-filter-overlay"></div>
  <section id="mwFilterSheet" class="mw-filter-sheet" role="dialog" aria-label="Filter Records">
    <div class="mw-sheet-handle"></div>
    <div class="mw-sheet-head">
      <div class="mw-sheet-title-row">
        <div class="mw-filter-head-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;"><path d="M4 5h16l-6.5 7.5V19l-3 1.5v-8z"/></svg>
        </div>
        <h2>Filter Records</h2>
      </div>
      <button id="mwFilterClose" class="mw-sheet-close-btn no-btn-theme" type="button" aria-label="Close">✕</button>
    </div>

    <div class="mw-filter-fields">
      <!-- Date Presets Grid -->
      <div class="mw-field">
        <span>Date Range Presets</span>
        <div class="mw-sheet-presets-grid">
          <button type="button" class="mw-sheet-preset-btn no-btn-theme" id="mwSheetPreset7">Last 7 Days</button>
          <button type="button" class="mw-sheet-preset-btn no-btn-theme active" id="mwSheetPresetMonth">This Month</button>
          <button type="button" class="mw-sheet-preset-btn no-btn-theme" id="mwSheetPresetLastMonth">Last Month</button>
          <button type="button" class="mw-sheet-preset-btn no-btn-theme" id="mwSheetPresetCustom">Custom Range</button>
        </div>
      </div>

      <!-- Sheet Custom Range Date Pickers -->
      <div id="mwSheetCustomRangeBox" class="mw-sheet-custom-box" hidden>
        <div class="mw-sheet-date-inputs">
          <label class="mw-date-input-wrap"><span>From</span><input type="date" id="mwSheetFromInput"></label>
          <label class="mw-date-input-wrap"><span>To</span><input type="date" id="mwSheetToInput"></label>
        </div>
      </div>

      <!-- Hidden standard Date Range for table compatibility -->
      <div class="mw-field" id="mwDateRangeWrap" style="display:none;"><div id="mwDateRange"></div></div>

      <!-- Staff / Employee Selector (Admin Only) -->
      <label id="mwEmployeeField" class="mw-field" hidden>
        <span>Employee / Staff Filter</span>
        <div class="mw-select-wrap">
          <select id="mwEmployee"><option value="">All employees (Sabhi Staff)</option></select>
          <svg class="mw-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </label>

      <!-- Status Filter Radio Pills -->
      <div class="mw-field">
        <span>Record Status</span>

    <div class="mw-filter-actions">
      <button id="mwClear" class="secondary no-btn-theme mw-clear-btn" type="button">Clear</button>

  <script>
    const routePath=location.pathname.replace(/\/+$/,'')||'/';
    const moduleKey=routePath.split('/').pop().replace('-table','');
    const definitions={
      collection:{title:'Collection Records',description:'View collection records. Use Add to create a new entry.',permission:'Customer Entry',entry:'/collection-entry',entryPage:'collection-entry'},
      expense:{title:'Expense Records',description:'View employee expense records. Use Add to create a new entry.',permission:'Daily Expense',entry:'/expense-entry',entryPage:'expense-entry'},
      salary:{title:'Salary Records',description:'View salary payment records. Use Add to create a new entry.',permission:'Salary',entry:'/salary-entry',entryPage:'salary-entry'},
      counter:{title:'Counter Cash Records',description:'View counter cash records. Use Add to create a new entry.',permission:'Cash At Counter',entry:'/counter-entry',entryPage:'counter-entry'}
    };
    const definition=definitions[moduleKey]||definitions.collection;
    const table=document.getElementById('recordsTable'),head=document.getElementById('head'),body=document.getElementById('rows'),statusBox=document.getElementById('status'),detailsDialog=document.getElementById('detailsDialog'),detailsList=document.getElementById('detailsList');
    const statusFilter=document.getElementById('statusFilter');
    const bulkBar=document.getElementById('bulkBar'),selectedCount=document.getElementById('selectedCount'),bulkDeleteButton=document.getElementById('bulkDelete'),clearSelectionButton=document.getElementById('clearSelection');
    const mobileRecords=document.getElementById('mobileRecords'),mobileLoadMore=document.getElementById('mobileLoadMore'),mobileListMeta=document.getElementById('mobileListMeta');
    const mobileFilterButton=document.getElementById('mobileFilterButton'),mobileFilterCount=document.getElementById('mobileFilterCount'),mobileFilterChips=document.getElementById('mobileFilterChips');
    const recordFilters=document.getElementById('recordFilters'),mobileFilterOverlay=document.getElementById('mobileFilterOverlay');
    const requestedEmployeeId=new URLSearchParams(location.search).get('employeeId')||'';
    let page=1,session=null,dateControl=null,selectedIds=new Set(),lastPageIds=[],selectAllCheckbox=null,mobileAppending=false;
    document.getElementById('title').textContent=definition.title;
    document.getElementById('description').textContent=definition.description;
    const entryLink=document.getElementById('entryLink');
    entryLink.href=definition.entry;
    function money(value){return'INR '+Number(value||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
    function dateText(value){if(!value)return'—';const date=new Date(value);return Number.isNaN(date.getTime())?'—':date.toLocaleDateString('en-IN')}
    function dateTimeText(value){if(!value)return'—';const date=new Date(value);return Number.isNaN(date.getTime())?'—':date.toLocaleString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true})}
    function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[character])}
    function recordTitle(record){
      if(moduleKey==='collection')return record.serviceType||'Collection';
      if(moduleKey==='expense')return record.expenseType||'Expense';
      if(moduleKey==='salary')return `Salary · ${record.salaryMonth||dateText(record.entryDate)}`;
      return 'Cash at counter';
    }
    function columns(){

    function salRenderList(){
      const rows=[
        ...salAdvanceRecords().map(record=>({record,type:'advance'})),
        ...salSalaryRecords().map(record=>({record,type:'salary'}))
      ].filter(row=>salFilter==='all'||row.type===salFilter)
        .sort((left,right)=>new Date(right.record.entryDate)-new Date(left.record.entryDate)||new Date(right.record.createdAt||0)-new Date(left.record.createdAt||0));
      salList.innerHTML=rows.length?rows.map(({record,type})=>`<article class="sal-row"><span class="sal-date">${escapeHtml(salDateText(record.entryDate))}</span><span class="sal-chip ${type}">${type==='advance'?'Advance':'Salary Paid'}</span><strong class="sal-amount ${type}">− ${salMoney(record.amount)}</strong></article>`).join(''):'<div class="sal-empty">No money taken this month.</div>';
    }
    function salRender(){
      if(!salData)return;
      const summary=salData.summary||{};
      const advance=salAdvanceRecords().reduce((sum,record)=>sum+Number(record.amount||0),0);
      const salaryPaid=salSalaryRecords().reduce((sum,record)=>sum+Number(record.amount||0),0);
      const earned=Number(summary.earnedSalary||0);
      const taken=advance+salaryPaid;
      const extra=Math.max(0,taken-earned);
      const balance=Math.max(0,earned-taken);
      const percent=earned>0?Math.floor(taken/earned*100):taken>0?100:0;
      const scale=extra>0?taken+extra:Math.max(earned,taken,1);
      const advanceWidth=Math.min(100,advance/scale*100);
      const salaryWidth=Math.min(100-advanceWidth,salaryPaid/scale*100);
      const extraWidth=extra>0?Math.max(0,100-advanceWidth-salaryWidth):0;
      const salaryRule=summary.salaryMode==='fixed'?'Fixed monthly salary':`My Work ${salMoney(summary.collection)} × ${Number(summary.salaryPercentage||0)}%`;
      salMonthLabel.textContent=salMonthText(salMonth.value);
      salSummary.innerHTML=`
        <div class="sal-line"><span class="sal-icon">+</span><div class="sal-copy"><strong>Earned Salary</strong><small>${escapeHtml(salaryRule)}</small></div><b class="sal-green">${salMoney(earned)}</b></div>
        <div class="sal-line"><span class="sal-icon">−</span><div class="sal-copy"><strong>Advance Taken</strong><small>Taken In Between, Daily Or Alternate Days</small></div><b class="sal-orange">${salMoney(advance)}</b></div>
        <div class="sal-line"><span class="sal-icon">−</span><div class="sal-copy"><strong>Salary Paid</strong><small>Salary Given To You In Parts</small></div><b class="sal-blue">${salMoney(salaryPaid)}</b></div>
        <div class="sal-taken"><span>Taken ${salMoney(taken)} Of ${salMoney(earned)}</span><b>${percent}%</b></div>
        <div class="sal-progress" aria-hidden="true"><span class="sal-advance-bar" style="width:${advanceWidth}%"></span><span class="sal-salary-bar" style="width:${salaryWidth}%"></span>${extraWidth>0?`<span class="sal-extra-bar" style="width:${extraWidth}%"></span>`:''}</div>
        <div class="sal-legend"><span class="advance"><i></i>Advance Taken</span><span class="salary"><i></i>Salary Paid</span>${extra>0?'<span class="extra"><i></i>Extra Paid</span>':''}</div>
        ${extra>0?`<div class="sal-balance extra"><div><span>EXTRA PAID</span><small>More Than Earned Salary</small></div><strong>${salMoney(extra)}</strong></div>`:`<div class="sal-balance"><div><span>BALANCE TO GET</span><small>Earned Less Taken</small></div><strong>${salMoney(balance)}</strong></div>`}
      `;
      salFilters.innerHTML=[['all','All'],['advance','Advance'],['salary','Salary Paid']].map(([key,label])=>`<button type="button" class="sal-filter no-btn-theme${salFilter===key?' active':''}" data-filter="${key}">${label}</button>`).join('');
      salRenderList();
    }

        const remarkLabel=document.createElement('span');remarkLabel.textContent='Remark:';
        const remarkValue=document.createElement('strong');remarkValue.textContent=record.remark;
        remark.append(remarkLabel,remarkValue);meta.append(remark);
      }
      if(meta.childElementCount)details.append(meta);
      details.append(mwByline(record,dateKey,'mw-detail-byline'));
      const actions=document.createElement('div');actions.className='mw-actions';
      actions.append(mwActionButton('view','View',()=>showDetails(record)));
      if(record.status!=='Inactive'&&can('edit')&&session.pageAccess?.[definition.entryPage]!==false){
        const edit=document.createElement('a');edit.className='mw-action no-btn-theme edit';edit.title='Edit work entry';edit.setAttribute('aria-label','Edit work entry');edit.href=`${definition.entry}?edit=${encodeURIComponent(record._id)}`;
        edit.append(mwActionIcon('edit'));const editText=document.createElement('span');editText.textContent='Edit';edit.append(editText);edit.addEventListener('click',event=>event.stopPropagation());actions.append(edit);
      }
      if(record.status!=='Inactive'&&can('delete'))actions.append(mwActionButton('delete','Delete',button=>mwSoftDelete(record,button)));
      details.append(actions);
      const toggle=()=>{const open=!card.classList.contains('open');for(const other of mwRecords.querySelectorAll('.mw-card.open'))other.classList.remove('open');card.classList.toggle('open',open);summary.setAttribute('aria-expanded',String(open))};
      summary.addEventListener('click',event=>{if(event.target.closest('button,a'))return;toggle()});
      summary.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle()}});
      card.append(summary,details);return card;
    }

    function mwUpdateActiveFilterStrip(){
      const strip=document.getElementById('mwActiveFilterStrip');
      const text=document.getElementById('mwActiveFilterText');
      if(!strip||!text)return;

      const parts=[];
      if(mwActivePreset==='custom'){
        const from=mwCurrentRange.from,to=mwCurrentRange.to;
        if(from&&to){
          const d1=new Date(`${from}T00:00:00`),d2=new Date(`${to}T00:00:00`);
          const diffDays=Math.ceil(Math.abs(d2.getTime()-d1.getTime())/(1000*60*60*24))+1;
          parts.push(`${mwDateLabel(from)} – ${mwDateLabel(to)} (${diffDays} ${diffDays===1?'Day':'Days'})`);
        }
      }
      if(mwStatusFilter&&mwStatusFilter.value&&mwStatusFilter.value!=='Active'){
        parts.push(mwStatusFilter.value==='Inactive'?'In-Active':'All Statuses');
      }
      if(mwEmployee&&mwEmployee.value){
        const opt=mwEmployee.options[mwEmployee.selectedIndex];
        if(opt&&opt.text)parts.push(opt.text);
      }

      if(parts.length>0){
        text.textContent=parts.join(' · ');
        strip.removeAttribute('hidden');
      }else{
        strip.setAttribute('hidden','');
      }
    }

    function mwUpdateStats(from,to,totalAmount){
      if(!from||!to)return;
      const d1=new Date(`${from}T00:00:00`),d2=new Date(`${to}T00:00:00`);
      const diffDays=Math.ceil(Math.abs(d2.getTime()-d1.getTime())/(1000*60*60*24))+1;
      if(mwDaysBadge)mwDaysBadge.textContent=`${diffDays} ${diffDays===1?'Day':'Days'}`;
      if(mwTotalBadge)mwTotalBadge.textContent=mwMoney(totalAmount);
      if(mwStatsBox)mwStatsBox.title=`${mwDateLabel(from)} – ${mwDateLabel(to)}`;
      mwUpdateActiveFilterStrip();
    }

    function mwRender(data,append=false){
      if(!append){mwRecords.replaceChildren();mwLastGroup=''}
      mwGroupData=new Map((data.dateGroups||[]).map(group=>[group.date,group]));
      const totalAmount=(data.dateGroups||[]).reduce((sum,group)=>sum+Number(group.total||0),0);
      mwUpdateStats(mwCurrentRange.from,mwCurrentRange.to,totalAmount);
      mwListMeta.replaceChildren();
      const entries=document.createElement('span');entries.innerHTML=`<strong>${Number(data.total||0)}</strong> entries`;
      const total=document.createElement('span');total.className='total';total.textContent=`${mwMoney(totalAmount)} total`;
      mwListMeta.append(entries,total);
      if(!data.records.length&&!append){const empty=document.createElement('div');empty.className='m-empty';empty.textContent='No work entries found for this filter.';mwRecords.append(empty)}
      for(const record of data.records){
        const dateKey=mwDateKey(record.entryDate);
        if(dateKey!==mwLastGroup){
          const group=mwGroupData.get(dateKey)||{date:dateKey,count:1,total:record.amount};
          mwRecords.append(mwGroupHead(dateKey,group.count,group.total));mwLastGroup=dateKey;
        }
        mwRecords.append(mwRenderCard(record));
      }
      mwPage=Number(data.page||1);
      mwLoadMore.hidden=mwPage*Number(data.limit||20)>=Number(data.total||0);
    }

    async function mwLoad(append=false){
      if(mwLoading)return;
      const range=mwCurrentRange;
      if(!range?.from||!range?.to||range.to<range.from){mwSetStatus('Select a valid date range.',true);return}
      const targetPage=append?mwPage+1:1;
      const params=new URLSearchParams({page:String(targetPage),limit:'20',from:range.from,to:range.to,status:mwStatusFilter.value});
      if(session.employee.role==='Admin'&&mwEmployee.value)params.set('employeeId',mwEmployee.value);
      mwLoading=true;mwSetStatus('');
      if(append){mwLoadMore.disabled=true;mwLoadMore.textContent='Loading...'}
      try{mwRender(await salonAuth.request('/api/my-work?'+params.toString()),append)}
      catch(error){mwSetStatus(error.message||'Could not load your work entries.',true)}
      finally{mwLoading=false;mwLoadMore.disabled=false;mwLoadMore.textContent='Load more'}
    }

    async function mwSoftDelete(record,button){
      if(!record._id||!window.confirm('Move this work entry to In-Active It will remain available under the In-Active filter.'))return;
      if(button)button.disabled=true;
      try{const result=await salonAuth.request(`/api/collections/${encodeURIComponent(record._id)}`,{method:'DELETE'});if(window.salonUi?.showSuccess)await window.salonUi.showSuccess(result.message||'Work entry moved to In-Active.');await mwLoad()}
      catch(error){mwSetStatus(error.message||'Could not move the work entry to In-Active.',true);if(button)button.disabled=false}
    }

    function mwSetPreset(preset){
      mwActivePreset=preset;
      [mwPreset7,mwPresetMonth,mwPresetCustom].forEach(btn=>btn?.classList.remove('active'));
      const sheetPresetBtns=document.querySelectorAll('.mw-sheet-preset-btn');
      sheetPresetBtns.forEach(btn=>btn.classList.remove('active'));
      document.getElementById('mwSheetCustomRangeBox')?.setAttribute('hidden','');
      mwCustomPickerBox?.setAttribute('hidden','');

      if(preset==='7days'){
        mwPreset7?.classList.add('active');
        document.getElementById('mwSheetPreset7')?.classList.add('active');
        mwCurrentRange=mw7DaysRange();
      }else if(preset==='month'){
        mwPresetMonth?.classList.add('active');
        document.getElementById('mwSheetPresetMonth')?.classList.add('active');
        mwCurrentRange=mwMonthRange();
      }else if(preset==='lastmonth'){
        document.getElementById('mwSheetPresetLastMonth')?.classList.add('active');
        mwCurrentRange=mwLastMonthRange();
      }else if(preset==='custom'){
        mwPresetCustom?.classList.add('active');
        document.getElementById('mwSheetPresetCustom')?.classList.add('active');
      }
      mwDateControl?.setRange?.(mwCurrentRange.from,mwCurrentRange.to,false);
      mwUpdateActiveFilterStrip();
      const activeBtn=document.querySelector('.mw-pill-btn.active');
      activeBtn?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
    }

    function mwBindEvents(){
      if(mwEventsBound)return;mwEventsBound=true;
      mwFilterButton.addEventListener('click',mwOpenFilters);
      document.getElementById('mwFilterClose').addEventListener('click',mwCloseFilters);
      mwFilterOverlay.addEventListener('click',mwCloseFilters);

      // Single-line bar presets
      mwPreset7?.addEventListener('click',()=>{mwSetPreset('7days');mwLoad();});
      mwPresetMonth?.addEventListener('click',()=>{mwSetPreset('month');mwLoad();});
      mwPresetCustom?.addEventListener('click',()=>{
        const isHidden=mwCustomPickerBox?.hasAttribute('hidden');
        if(isHidden){
          mwCustomPickerBox?.removeAttribute('hidden');
          mwPresetCustom?.classList.add('active');
          if(!mwCustomFrom.value)mwCustomFrom.value=mwCurrentRange.from;
          if(!mwCustomTo.value)mwCustomTo.value=mwCurrentRange.to;
        }else{
          mwCustomPickerBox?.setAttribute('hidden','');
        }
      });

      mwCustomApply?.addEventListener('click',()=>{
        const from=mwCustomFrom.value,to=mwCustomTo.value;
        if(!from||!to||to<from){alert('Select a valid from and to date.');return;}
        mwCurrentRange={from,to};
        mwActivePreset='custom';
        [mwPreset7,mwPresetMonth].forEach(btn=>btn?.classList.remove('active'));
        mwPresetCustom?.classList.add('active');
        mwCustomPickerBox?.setAttribute('hidden','');
        mwUpdateActiveFilterStrip();
        mwPresetCustom?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
        mwLoad();
      });

      document.getElementById('mwActiveFilterReset')?.addEventListener('click',()=>{
        mwSetPreset('month');
        if(mwStatusFilter)mwStatusFilter.value='Active';
        const activeRadio=document.querySelector('input[name="mwStatusRadio"][value="Active"]');
        if(activeRadio)activeRadio.checked=true;
        if(mwEmployee)mwEmployee.value='';
        mwUpdateActiveFilterStrip();
        mwLoad();
      });

      document.getElementById('mwActiveFilterTrigger')?.addEventListener('click',()=>{
        const isHidden=mwCustomPickerBox?.hasAttribute('hidden');
        if(isHidden){
          mwCustomPickerBox?.removeAttribute('hidden');
          if(!mwCustomFrom.value)mwCustomFrom.value=mwCurrentRange.from;
          if(!mwCustomTo.value)mwCustomTo.value=mwCurrentRange.to;
          mwCustomPickerBox.scrollIntoView({behavior:'smooth',block:'nearest'});
        }else{
          mwCustomPickerBox?.setAttribute('hidden','');
        }
      });

      // Sheet presets
      document.getElementById('mwSheetPreset7')?.addEventListener('click',()=>{
        mwSetPreset('7days');
      });
      document.getElementById('mwSheetPresetMonth')?.addEventListener('click',()=>{
        mwSetPreset('month');
      });
      document.getElementById('mwSheetPresetLastMonth')?.addEventListener('click',()=>{
        mwSetPreset('lastmonth');
      });
      document.getElementById('mwSheetPresetCustom')?.addEventListener('click',()=>{
        mwSetPreset('custom');
        const box=document.getElementById('mwSheetCustomRangeBox');
        if(box){
          box.removeAttribute('hidden');
          const fInput=document.getElementById('mwSheetFromInput');
          const tInput=document.getElementById('mwSheetToInput');
          if(fInput&&!fInput.value)fInput.value=mwCurrentRange.from;
          if(tInput&&!tInput.value)tInput.value=mwCurrentRange.to;
        }
      });

      // Sheet Status Radio pills
      document.querySelectorAll('input[name="mwStatusRadio"]').forEach(radio=>{
        radio.addEventListener('change',()=>{
          mwStatusFilter.value=radio.value;
        });
      });

      document.getElementById('mwApply').addEventListener('click',()=>{
        if(mwActivePreset==='custom'){
          const fInput=document.getElementById('mwSheetFromInput');
          const tInput=document.getElementById('mwSheetToInput');
          if(fInput?.value&&tInput?.value){
            if(tInput.value<fInput.value){alert('Select a valid from and to date.');return;}
            mwCurrentRange={from:fInput.value,to:tInput.value};
          }
        }
        mwCloseFilters();mwSetStatus('');mwUpdateActiveFilterStrip();mwLoad();
      });

      document.getElementById('mwClear').addEventListener('click',()=>{
        mwSetPreset('month');
        mwStatusFilter.value='Active';
        const activeRadio=document.querySelector('input[name="mwStatusRadio"][value="Active"]');
        if(activeRadio)activeRadio.checked=true;
        if(mwEmployee)mwEmployee.value='';
        mwCloseFilters();mwSetStatus('');mwUpdateActiveFilterStrip();mwLoad();
      });

      mwLoadMore.addEventListener('click',()=>mwLoad(true));
      document.addEventListener('keydown',event=>{if(event.key==='Escape'){mwCloseFilters();mwCustomPickerBox?.setAttribute('hidden','');}});
    }

    async function mwInit(){
      document.querySelector('main.wrap').hidden=true;mobileAllWork.hidden=false;document.body.classList.add('mw-mobile-page');
      document.title='My Work - YOURS SALON';
      mwDateControl=SalonDateRange.mount(mwDateRange,{defaultPreset:'thisMonth',popoverPlacement:'center',onChange:()=>{}});
      
      // Default to This Month
      mwCurrentRange=mwMonthRange();
      mwCustomFrom.value=mwCurrentRange.from;
      mwCustomTo.value=mwCurrentRange.to;
      const sheetFrom=document.getElementById('mwSheetFromInput');
      const sheetTo=document.getElementById('mwSheetToInput');
      if(sheetFrom)sheetFrom.value=mwCurrentRange.from;
      if(sheetTo)sheetTo.value=mwCurrentRange.to;
      mwStatusFilter.value='Active';

      if(session.employee.role==='Admin'){
        document.getElementById('mwEmployeeField').hidden=false;
        const staff=await salonAuth.request('/api/staff');
        for(const employee of staff)mwEmployee.add(new Option(`${employee.employeeName} · ${employee.employeeId}`,employee._id));
        if(requestedEmployeeId&&staff.some(employee=>employee._id===requestedEmployeeId))mwEmployee.value=requestedEmployeeId;
      }
      mwBindEvents();
      await mwLoad();
    }
    
    function render(data,append=false){
      const currentColumns=columns(),selectable=canBulkDelete();head.replaceChildren();
      const headerRow=document.createElement('tr');selectAllCheckbox=null;
      if(selectable){
        const th=document.createElement('th');th.className='select-column';th.dataset.fixedColumn='true';
        const checkbox=document.createElement('input');checkbox.type='checkbox';
        const label=document.createElement('span');label.className='visually-hidden';label.textContent='Select';
        checkbox.setAttribute('aria-label','Select all records on this page');
        checkbox.addEventListener('change',()=>{
          for(const id of lastPageIds){
            if(checkbox.checked)selectedIds.add(id);else selectedIds.delete(id);
          }
          body.querySelectorAll('input[data-row-select]').forEach(rowCheckbox=>{rowCheckbox.checked=checkbox.checked});
          updateBulkBar();
        });
        selectAllCheckbox=checkbox;th.append(checkbox,label);headerRow.append(th);
      }
      for(const [label] of currentColumns){const th=document.createElement('th');th.textContent=label;if(label==='Actions')th.className='sticky-action';headerRow.append(th)}
      head.append(headerRow);body.replaceChildren();
      lastPageIds=data.records.map(record=>String(record._id));
      if(!data.records.length){const empty=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=currentColumns.length+(selectable?1:0);cell.className='empty';cell.textContent='No records found.';empty.append(cell);body.append(empty)}
      for(const record of data.records){
        const tr=document.createElement('tr');
        if(record.status==='Inactive')tr.className='row-inactive';
        if(selectable)tr.append(selectionCell(record));
        for(const [,key,format] of currentColumns){
          if(key==='__actions')tr.append(actionCell(record));
          else if(key==='status')tr.append(statusCell(record));
          else tr.append(Object.assign(document.createElement('td'),{textContent:displayValue(record,key,format)}));
        }
        body.append(tr);
      }
      page=data.page;table.dataset.page=String(data.page);table.dataset.pageSize=String(data.limit);table.dataset.total=String(data.total);table.dataset.dataset=moduleKey;
      renderMobile(data,append);updateBulkBar();updateMobileFilterBar();
    }
    async function load(append=false){
      const range=dateControl.getRange();
      const requestedPage=append?page+1:page;
      const params=new URLSearchParams({module:moduleKey,page:String(requestedPage),limit:'10',from:range.from,to:range.to,status:statusFilter.value});
      if(document.getElementById('employee').value)params.set('employeeId',document.getElementById('employee').value);
      try{render(await salonAuth.request('/api/module-records?'+params.toString()),append)}
      catch(error){body.innerHTML='<tr><td class="empty">Could not load records.</td></tr>';statusBox.textContent=error.message;statusBox.className='status show'}
    }
    async function softDelete(record,button){
      if(!record._id||!window.confirm('Move this record to In-Active It will remain available under the In-Active filter.'))return;
      button.disabled=true;statusBox.className='status';
      try{const endpoint=moduleKey==='collection'?`/api/collections/${encodeURIComponent(record._id)}`:`/api/employee-records/${encodeURIComponent(record._id)}`;const result=await salonAuth.request(endpoint,{method:'DELETE'});if(window.salonUi?.showSuccess)await window.salonUi.showSuccess(result.message||'Record moved to In-Active.');await load()}
      catch(error){statusBox.textContent=error.message||'Could not move the record to In-Active.';statusBox.className='status show';button.disabled=false}
    }
    dateControl=SalonDateRange.mount(document.getElementById('dateRange'),{defaultPreset:'last30',onChange:()=>{clearSelection();page=1;updateMobileFilterBar();load()}});
    document.getElementById('filter').addEventListener('click',()=>{clearSelection();page=1;closeMobileFilters();load()});
    statusFilter.addEventListener('change',()=>{clearSelection();page=1;updateMobileFilterBar();load()});
    document.getElementById('clear').addEventListener('click',()=>{clearSelection();dateControl.reset(false);statusFilter.value='Active';document.getElementById('employee').value='';page=1;closeMobileFilters();load()});
    clearSelectionButton.addEventListener('click',clearSelection);
    bulkDeleteButton.addEventListener('click',bulkDelete);
    document.getElementById('closeDetails').addEventListener('click',()=>detailsDialog.close?.());
    table.addEventListener('table-view-page-change',event=>{page=event.detail.page;load()});
    mobileLoadMore.addEventListener('click',()=>load(true));
    mobileFilterButton.addEventListener('click',openMobileFilters);
    document.getElementById('mobileFilterClose').addEventListener('click',closeMobileFilters);
    mobileFilterOverlay.addEventListener('click',closeMobileFilters);
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMobileFilters()});
    window.salonPageReady=(async()=>{try{session=await window.salonReady;if(!session)return;const viewAccess=session.actionAccess?.[moduleKey]?.view;      if(viewAccess===false||(!session.actionAccess&&!(session.employee.role==='Admin'||session.permissions.includes(definition.permission)))){statusBox.textContent=`You do not have ${definition.permission} access.`;statusBox.className='status show';return}
      if(moduleKey==='salary'&&isMobileViewport&&session.employee.role!=='Admin'){await salInit();return}
      if(moduleKey==='collection'&&isMobileViewport){await mwInit();return}
      if(session.employee.role==='Admin'){document.getElementById('employeeField').hidden=false;const staff=await salonAuth.request('/api/staff');for(const employee of staff)document.getElementById('employee').add(new Option(`${employee.employeeName} · ${employee.employeeId}`,employee._id));if(requestedEmployeeId&&staff.some(employee=>employee._id===requestedEmployeeId))document.getElementById('employee').value=requestedEmployeeId}
      if(!can('add')||session.pageAccess?.[definition.entryPage]===false)entryLink.hidden=true;
      updateBulkBar();updateMobileFilterBar();
      await load()}catch(error){if(mobileAllWork&&!mobileAllWork.hidden){mwSetStatus(error.message||'Could not load your work entries.',true);return}statusBox.textContent=error.message;statusBox.className='status show'}})();
  </script>
</body>
</html>
